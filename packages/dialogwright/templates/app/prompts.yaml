# yaml-language-server: $schema={{root}}/packages/dialogwright/schemas/prompts.schema.json
# Every line a caller can hear, word for word. The agent says exactly these and never composes its
# own. Braces are filled in by the engine ({intentLabel}) or by the code ({service}); `interruptible`
# says whether a caller may talk over it. `pnpm check` lists any line the engine needs that is
# missing here.
prompts:
  # The opening lines and the engine's own lines
  greeting:
    text: Thanks for calling {{display}}. I can book a service. How can I help?
    interruptible: true
  greeting_chat:
    text: Hi, this is {{display}}. I can book a service. What can I help with?
    interruptible: true
  ask_intent:
    text: How can I help you today?
    interruptible: true
  nomatch_open:
    text: Sorry, I didn't catch that. You can ask to book a service.
    interruptible: true
  nomatch_dtmf_menu:
    text: Let's try the keypad. To book a service press 1. To speak with someone press 0.
    interruptible: true
  no_input:
    text: I didn't hear anything.
    interruptible: false
  ack_intent:
    text: Sure, I can help you {intentLabel}.
    interruptible: false
  confirm_intent_explicit:
    text: Just to check, do you want to {intentLabel}? Yes or no.
    interruptible: false
  disambiguate_intent:
    text: Do you want to {a}, or {b}?
    interruptible: true
  ack_intent_then:
    text: Sure, I can help you {a}, and then {b}.
    interruptible: false
  ack_queued:
    text: Sure, we'll {intentLabel} after this.
    interruptible: false
  bridge_next:
    text: Now, let's {intentLabel}.
    interruptible: false
  ack_frustration:
    text: I understand, let's get this sorted.
    interruptible: false
  offer_transfer:
    text: Would you like me to connect you to a person, or keep going?
    interruptible: true
  ack_declined:
    text: Okay, let's keep going.
    interruptible: false
  system_slow_dtmf_hint:
    text: Sorry for the delay. You can also use your keypad.
    interruptible: true
  system_slow_chat:
    text: Sorry, I'm having trouble on my end. Please send that again.
    interruptible: true
  ask_change:
    text: What should I change?
    interruptible: true
  confirm_dtmf:
    text: Press 1 to confirm, or 2 to change something.
    interruptible: false
  anything_else:
    text: Is there anything else I can help with?
    interruptible: true
  goodbye:
    text: Goodbye.
    interruptible: false
  goodbye_chat:
    text: Thanks for chatting with {{display}}. Goodbye.
    interruptible: false
  screen_reprompt:
    text: I can help you book a service.
    interruptible: true
  screen_reprompt_form:
    text: Let's keep going.
    interruptible: true
  handoff_live_agent:
    text: One moment while I connect you to a person.
    interruptible: false
  handoff_frustrated:
    text: Let me get you to someone who can help.
    interruptible: false
  handoff_max_attempts:
    text: Let me get someone to help you with that.
    interruptible: false
  handoff_system_failure:
    text: I'm having trouble right now. Let me connect you to someone.
    interruptible: false
  handoff_needs_human:
    text: This one needs a person. Let me connect you to someone.
    interruptible: false
  handoff_security:
    text: Let me connect you to someone who can help.
    interruptible: false

  # The slots: ask_<slot> and ask_<slot>_retry for each, plus whatever lines its type needs
  ask_service:
    text: Which service would you like to book, a repair, an inspection, or an installation?
    interruptible: true
  ask_service_retry:
    text: Sorry, is that a repair, an inspection, or an installation?
    interruptible: true

  # The forms: the summary read back for a yes, and the line the form says when it completes
  confirm_book_service:
    text: You'd like to book {service}. Shall I do that?
    interruptible: true
  service_booked:
    text: Done. I've booked {service}, and the first opening is {when}.
    interruptible: false
