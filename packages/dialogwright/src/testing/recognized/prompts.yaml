# yaml-language-server: $schema=../../../schemas/prompts.schema.json
# Every line a caller can hear, word for word. The agent says exactly these and never composes its
# own. Braces are filled in by the engine ({intentLabel}) or by the code ({ref}); `interruptible`
# says whether a caller may talk over it. `pnpm check` lists any line the engine needs that is
# missing here.
prompts:
  # The opening lines and the engine's own lines
  greeting:
    text: Thanks for calling Example Account Line. I can take a report of a problem, or check on a request. How can I help?
    interruptible: true
  greeting_chat:
    text: Hi, this is Example Account Line. I can take a report of a problem, or check on a request. What can I help with?
    interruptible: true
  ask_intent:
    text: How can I help you today?
    interruptible: true
  nomatch_open:
    text: Sorry, I didn't catch that. You can report a problem, or check on a request.
    interruptible: true
  nomatch_dtmf_menu:
    text: Let's try the keypad. To report a problem press 1. To check on a request press 2. To speak with someone press 0.
    interruptible: true
  no_input:
    text: I didn't hear anything.
    interruptible: false
  ack_intent:
    text: Sure, I can help you {intentLabel}.
    interruptible: false
  confirm_intent_explicit:
    text: Just to check, do you want to {intentLabel}? Yes or no.
    interruptible: false
  disambiguate_intent:
    text: Do you want to {a}, or {b}?
    interruptible: true
  ack_intent_then:
    text: Sure, I can help you {a}, and then {b}.
    interruptible: false
  ack_queued:
    text: Sure, we'll {intentLabel} after this.
    interruptible: false
  bridge_next:
    text: Now, let's {intentLabel}.
    interruptible: false
  ack_frustration:
    text: I understand, let's get this sorted.
    interruptible: false
  offer_transfer:
    text: Would you like me to connect you to a person, or keep going?
    interruptible: true
  ack_declined:
    text: Okay, let's keep going.
    interruptible: false
  system_slow_dtmf_hint:
    text: Sorry for the delay. You can also use your keypad.
    interruptible: true
  system_slow_chat:
    text: Sorry, I'm having trouble on my end. Please send that again.
    interruptible: true
  ask_change:
    text: What should I change?
    interruptible: true
  confirm_dtmf:
    text: Press 1 to confirm, or 2 to change something.
    interruptible: false
  anything_else:
    text: Is there anything else I can help with?
    interruptible: true
  goodbye:
    text: Goodbye.
    interruptible: false
  goodbye_chat:
    text: Thanks for chatting with Example Account Line. Goodbye.
    interruptible: false
  screen_reprompt:
    text: I can help you report a problem, or check on a request.
    interruptible: true
  screen_reprompt_form:
    text: Let's keep going.
    interruptible: true
  handoff_live_agent:
    text: One moment while I connect you to a person.
    interruptible: false
  handoff_frustrated:
    text: Let me get you to someone who can help.
    interruptible: false
  handoff_max_attempts:
    text: Let me get someone to help you with that.
    interruptible: false
  handoff_system_failure:
    text: I'm having trouble right now. Let me connect you to someone.
    interruptible: false
  handoff_needs_human:
    text: This one needs a person. Let me connect you to someone.
    interruptible: false
  handoff_security:
    text: Let me connect you to someone who can help.
    interruptible: false

  # The slots: ask_<slot> and ask_<slot>_retry for each, plus whatever lines its type needs
  ask_problem:
    text: What are you seeing, nothing working at all, or working only in part?
    interruptible: true
  ask_problem_retry:
    text: Sorry, is nothing working at all, or is it working only in part?
    interruptible: true
  ask_problem_dtmf:
    text: For nothing working at all press 1. For working only in part press 2.
    interruptible: true

  # The identity factors (identity.yaml): the slots' questions, and the engine's identity lines
  ask_accountId:
    text: What's your eight digit account number?
    interruptible: true
  ask_accountId_retry:
    text: Sorry, what's your account number? Please say it one digit at a time.
    interruptible: true
  ask_accountId_dtmf:
    text: Please key in your eight digit account number.
    interruptible: true
  ask_dob:
    text: And your date of birth?
    interruptible: true
  ask_dob_retry:
    text: Sorry, what's your date of birth? For example, June fourteenth, nineteen seventy five.
    interruptible: true
  ask_dob_dtmf:
    text: Please key in your date of birth as two digits for the month, two for the day, and four for the year.
    interruptible: true
  ask_dob_year:
    text: And the year you were born?
    interruptible: true
  # The caller-ID question (identity.yaml callerId): on a call from a number on file for one account,
  # asked in place of the account number. It names nothing of the account.
  identity_caller_match:
    text: I see an account associated with the number you're calling from. To access it, please tell me your date of birth, or say different account.
    interruptible: true
  # Said before the account number is asked, after "different account" or a no to it (optional).
  identity_caller_declined:
    text: Okay, let's find your account.
    interruptible: false
  identity_verified:
    text: Thank you, {first}. You're verified.
    interruptible: false
  identity_failed:
    text: I couldn't match those details. Let's try again.
    interruptible: false
  handoff_identity:
    text: I couldn't verify you, so let me connect you to someone who can help.
    interruptible: false

  # The forms: the report's summary and its ending, and the status
  confirm_report_problem:
    text: "You're reporting {problem}. Shall I file that?"
    interruptible: true
  problem_reported:
    text: Done. Your report number is {ref}.
    interruptible: false
  status_is:
    text: Your latest request, {ref}, is {status}.
    interruptible: false
  status_none:
    text: I don't see a request open on your account.
    interruptible: false
