# yaml-language-server: $schema=../../../schemas/intents.schema.json
intents:
  take_message:
    criteria: Wants to leave a message for someone, or have someone call them back
    label: take a message
    kind: form
  agent:
    criteria: Asks to speak with a person, a representative, or an operator
    label: speak with someone
    kind: control
  repeat_prompt:
    criteria: Asks the system to repeat what it just said, or to read it back exactly or word for word
    label: hear that again
    kind: control
  done:
    criteria: Says they are finished and need nothing more, as in no thanks, that's all, I'm all set, nothing else, I don't need anything else, or goodbye, including a bare no when just asked whether there is anything else
    label: finish up
    kind: control
  other:
    criteria: A request this line does not handle
    label: something else
    kind: control
  none:
    criteria: No request is expressed; the caller is only answering a question or saying something incidental
    label: nothing
    kind: control

menu:
  - digit: "1"
    intent: take_message
  - digit: "0"
    intent: agent
