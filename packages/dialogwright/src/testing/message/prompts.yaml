# yaml-language-server: $schema=../../../schemas/prompts.schema.json
# Every line a caller can hear. Most are said word for word. The message form's questions are
# generated (forms.yaml's wording: generative): a model words each for the moment, held to its fixed
# text's data and meaning, and the fixed text is said whenever a check fails or the model is slow. The
# read-back of the message is a framed line: its words are fixed, and say whose words follow, and only
# the summary inside it is generated, from the message itself (generate: summary, from: message), the
# first time it is said; after that, and whenever a check fails, the message is read word for word. The
# greeting and the line said when the message is passed on are prescribed: always said exactly as
# written.
# Every line a caller can hear, word for word. The agent says exactly these and never composes its
# own. Braces are filled in by the engine ({intentLabel}) or by the code ({ref}); `interruptible`
# says whether a caller may talk over it. `pnpm check` lists any line the engine needs that is
# missing here.
prompts:
  # The opening lines and the engine's own lines
  greeting:
    text: Thanks for calling Example Office. This call may be recorded. I can take a message. How can I help?
    interruptible: true
    prescribed: true
  greeting_chat:
    text: Hi, this is Example Office. I can take a message. What can I help with?
    interruptible: true
  ask_intent:
    text: How can I help you today?
    interruptible: true
  nomatch_open:
    text: Sorry, I didn't catch that. You can leave a message.
    interruptible: true
  nomatch_dtmf_menu:
    text: Let's try the keypad. To leave a message press 1. To speak with someone press 0.
    interruptible: true
  no_input:
    text: I didn't hear anything.
    interruptible: false
  ack_intent:
    text: Sure, I can help you {intentLabel}.
    interruptible: false
  confirm_intent_explicit:
    text: Just to check, do you want to {intentLabel}? Yes or no.
    interruptible: false
  disambiguate_intent:
    text: Do you want to {a}, or {b}?
    interruptible: true
  ack_intent_then:
    text: Sure, I can help you {a}, and then {b}.
    interruptible: false
  ack_queued:
    text: Sure, we'll {intentLabel} after this.
    interruptible: false
  bridge_next:
    text: Now, let's {intentLabel}.
    interruptible: false
  ack_frustration:
    text: I understand, let's get this sorted.
    interruptible: false
  offer_transfer:
    text: Would you like me to connect you to a person, or keep going?
    interruptible: true
  ack_declined:
    text: Okay, let's keep going.
    interruptible: false
  system_slow_dtmf_hint:
    text: Sorry for the delay. You can also use your keypad.
    interruptible: true
  system_slow_chat:
    text: Sorry, I'm having trouble on my end. Please send that again.
    interruptible: true
  confirm_dtmf:
    text: Press 1 to confirm, or 2 to change something.
    interruptible: false
  anything_else:
    text: Is there anything else I can help with?
    interruptible: true
  goodbye:
    text: Goodbye.
    interruptible: false
  goodbye_chat:
    text: Thanks for chatting with Example Office. Goodbye.
    interruptible: false
  screen_reprompt:
    text: I can help you take a message.
    interruptible: true
  screen_reprompt_form:
    text: Let's keep going.
    interruptible: true
  handoff_live_agent:
    text: One moment while I connect you to a person.
    interruptible: false
  handoff_frustrated:
    text: Let me get you to someone who can help.
    interruptible: false
  handoff_max_attempts:
    text: Let me get someone to help you with that.
    interruptible: false
  handoff_system_failure:
    text: I'm having trouble right now. Let me connect you to someone.
    interruptible: false
  handoff_needs_human:
    text: This one needs a person. Let me connect you to someone.
    interruptible: false
  handoff_security:
    text: Let me connect you to someone who can help.
    interruptible: false

  # The form's lines, generated by its switch (forms.yaml); each has a goal of its own.
  ask_recipient:
    text: Who is the message for, Dana Reyes or Lee Park?
    interruptible: true
    goal: Ask who the message is for, Dana Reyes or Lee Park; briefly acknowledge what the caller just said.
  ask_recipient_retry:
    text: Sorry, is the message for Dana Reyes or Lee Park?
    interruptible: true
    goal: Ask again, kindly, whether the message is for Dana Reyes or Lee Park.
  ask_caller:
    text: And who is the message from?
    interruptible: true
    goal: Ask for the caller's name.
  ask_caller_retry:
    text: Sorry, what name should I give?
    interruptible: true
  ask_phone:
    text: What's the best number to call you back on?
    interruptible: true
    goal: Ask for the number to call the caller back on.
  ask_phone_retry:
    text: Sorry, what's the ten-digit number to call you back on?
    interruptible: true
  ask_phone_dtmf:
    text: Please key in the ten-digit number on your keypad.
    interruptible: true
    # Said word for word: a keypad instruction.
    mode: fixed
  ask_message:
    text: What's the message?
    interruptible: true
    goal: Ask the caller for their message; you may acknowledge their name.
  ask_message_retry:
    text: Sorry, what message should I pass on?
    interruptible: true

  # The read-back, a framed line: every word of it is fixed, and it says whose words the summary
  # gives, but for {summary}, which the first time is a short summary of the message (generated from
  # it, and never sent anything else); after that, and whenever a check fails, the message word for
  # word, as stored. The frame reads true either way. A caller who says no hears it word for word
  # (forms.yaml's summary.onNo: read-back, after read_back_exact), and so does one who asks to hear it
  # again (repeat_prompt). The caller confirms the message kept, word for word, after hearing its
  # summary: summarizesConfirmed says the app accepts that.
  confirm_take_message:
    text: "Okay, thanks! I'll make sure {recipient} hears that {caller}, on {phone}, called and left this message: {summary}. Shall I pass it on?"
    interruptible: true
    generate:
      summary:
        from: message
        goal: Summarize the caller's message in one sentence, in their own terms.
        words: 25
    summarizesConfirmed: true
    when:
      situations: [first-ask]
  read_back_exact:
    text: Here it is exactly as I took it down.
    interruptible: false
  ask_change:
    text: What should I change? You can also ask me to read it back again.
    interruptible: true

  # Said when the message is passed on: prescribed, always word for word.
  message_taken:
    text: Thanks, {caller}. Your message for {recipient} has been passed on. Your reference is {ref}.
    interruptible: false
    prescribed: true
