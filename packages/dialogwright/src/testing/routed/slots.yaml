# yaml-language-server: $schema=../../../schemas/slots.schema.json
# What the caller is seeing.
problem:
  type: choice
  keypad: true
  options:
    out:
      say: nothing working at all
      means: The caller says nothing works at all, it is completely out
    partial:
      say: working only in part
      means: The caller says it works only in part, or only some of it works
  text:
    instructions: Read asr.text. What does the caller say the problem is?

# Whether it is a danger to anyone: a danger goes to a person once the report is filed (routes.yaml).
severity:
  type: choice
  keypad: true
  options:
    danger:
      say: a danger to someone
      means: The caller says someone is at risk of being hurt, or that it is dangerous
    minor:
      say: no danger
      means: The caller says no one is at risk and nothing is dangerous
  text:
    instructions: Read asr.text. Does the caller say it is a danger to anyone?

# The identity factors (identity.yaml): an account number and a date of birth.
accountId:
  type: digits
  noun: account
  length: 8
  group: [4, 4]
  keypad: true
dob:
  type: birthdate
  keypad: true
