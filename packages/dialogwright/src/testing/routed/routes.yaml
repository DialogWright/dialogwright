# yaml-language-server: $schema=../../../schemas/routes.schema.json
# What the call does at its start, once the caller is verified, and after a report: ordered rules,
# the first whose conditions all hold taken, an else last; the rules after it are not looked at. What
# the caller says still decides every other turn.
start:
  # Outside the hours (app.yaml), a line that says goodbye itself, with no greeting, and no goodbye
  # line after it.
  - when: { hours: closed }
    say: closed_now
    then: end
    goodbye: false
  # A caller on the vip list (the vip predicate in app.ts) goes straight to a person.
  - when: { named: vip }
    then: handoff
    reason: vip
  # An outage in the caller's region (the start hook's fact): the notice, then the greeting. A call to
  # the Spanish line started in Spanish (app.yaml's voice.numbers), so it hears both in Spanish.
  - when: { fact: outage, is: true }
    say: outage_notice
    then: continue
  - else: continue

afterIdentity:
  # An account with a balance past due sets up a payment plan first; the caller's own request follows.
  - when: { fact: account.pastDue, is: true }
    say: past_due_first
    then: form
    form: payment_plan
  - else: continue

afterForm:
  report_problem:
    # A danger to someone goes to a person as soon as the report is filed.
    - when: { slot: severity, is: danger }
      then: handoff
      reason: emergency
    - else: continue
