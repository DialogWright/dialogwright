# yaml-language-server: $schema=../../../schemas/app.schema.json
# Example Callbacks: a fictional line that sets up a callback, the engine's fixture for a slot that
# offers the number the caller is calling from (a digits slot's callerNumber). A caller whose number
# came with the call is asked whether it is the best one to reach them, rather than to say it.
id: callback
locale: en-US

brand:
  name: Example Callbacks
  mark: CB

console:
  formLabels:
    request_callback: Request a callback
  slotLabels:
    caller: Name
    phone: Callback number
    reason: About

wording:
  addressee: the Example Callbacks line

# The data a call or chat comes with that the app reads (callDataOf in app.ts). A call put through
# from the site's "call me" page carries its queue and the visitor's account reference as custom
# parameters; the line reads the queue to say when the callback comes. Each is recorded as its
# redact says (default mask).
callData:
  queue: { from: param.queue, redact: keep }
  accountRef: { from: param.accountRef, redact: last4 }
  forwardedFrom: { from: setup.forwardedFrom, redact: last4 }
  referral: { from: webhook.SipHeader_X-Referral }
  page: { from: chat.page, redact: keep }

fixtures:
  dir: src/testing/callback/fixtures
