  name: Example Callbacks
  mark: CB

console:
  formLabels:
    request_callback: Request a callback
  slotLabels:
    caller: Name
    phone: Callback number
    reason: About

wording:
  addressee: the Example Callbacks line

fixtures:
  dir: src/testing/callback/fixtures
