document: Example Town Library Visitor Guide
provenance:
  file: visitor-guide.pdf
  retrieved: 2026-09-01
sections:
  wifi:
    heading: Wi-Fi
    text: Every branch has free Wi-Fi. Join the network ExampleTownLibrary; no password is needed. Sessions end when the branch closes.
  printing:
    heading: Printing and copies
    text: Printing and copying cost 15 cents a page in black and white and 50 cents a page in color. Print from a branch computer, or send a file to print@library.example.com and collect it at the desk within two days.
  rooms:
    heading: Meeting rooms
    text: Meeting rooms seat up to twelve and can be booked up to thirty days ahead at any branch desk. They are free for nonprofit groups.
  lost-card:
    heading: A lost library card
    text: A lost card is replaced at any branch desk with a photo ID. The first replacement is free and each one after costs 2 dollars.
  staff:
    heading: Notes for staff
    text: Staff override codes for the self-checkout are kept in the binder at the main desk.
    summarize: false
