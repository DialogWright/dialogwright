# Examples of the `text` slot type: configurations, and what a caller might say to each.
# `answers` are the model's answers to the slot's questions, by question id (a slot reads the
# answers, not the words); `expect` is the outcome the slot must give. The conformance kit runs
# every utterance here, and the type's docs page shows them.

- name: problem description
  about: The defaults. One question asks whether the caller describes the problem; the words are the value, shown as "your description".
  slot: problem
  config:
    what: a description of the problem
  utterances:
    - text: The screen on my tablet went dark and it will not turn back on.
      answers:
        problemGiven: { noul: 0.93 }
      expect: { kind: filled, value: The screen on my tablet went dark and it will not turn back on., display: your description, confirm: none, displays: { es: "your description" } }
    - text: I need some help please
      answers:
        problemGiven: { noul: 0.12 }
      expect: { kind: absent }
    - text: oh and the charger is missing too
      answers:
        problemGiven: { noul: 0.9 }
      context: { current: The screen went dark., prompted: false }
      expect: { kind: absent }
    - text: Actually the screen flickers first and then goes dark.
      answers:
        problemGiven: { noul: 0.88 }
      context: { current: The screen went dark., prompted: true }
      expect: { kind: filled, value: Actually the screen flickers first and then goes dark., display: your description }
    - text: "   "
      answers:
        problemGiven: { noul: 0.9 }
      expect: { kind: absent }

- name: courier note
  about: A note with more guidance for the model, its own stand-in (in Spanish, the locale's), a length limit, and a first note that is never replaced.
  slot: courierNote
  config:
    what: a note for the courier
    instructions: Count where to leave the parcel and how to reach the door.
    say: your note
    keep: first
    maxLength: 36
  utterances:
    - text: please leave it behind the blue gate next to the shed, thank you
      answers:
        courierNoteGiven: { noul: 0.9 }
      expect: { kind: filled, value: please leave it behind the blue gate, display: your note }
    - text: ring the bell twice
      answers:
        courierNoteGiven: { noul: 0.91 }
      context: { current: please leave it behind the blue gate, prompted: true }
      expect: { kind: absent }
    - text: déjelo detrás de la puerta azul
      context: { locale: es }
      answers:
        courierNoteGiven: { noul: 0.9 }
      expect: { kind: filled, value: déjelo detrás de la puerta azul, display: su nota }
  wording:
    es: { say: su nota }

- name: existing wording and ids
  about: A slot moved onto the library keeps the question text and id it was recorded with, word for word.
  slot: issue
  config:
    text:
      given: Read asr.text. Does the caller say what went wrong with the order? A request alone is not.
    ids:
      given: describesIssue
  utterances:
    - text: the box arrived crushed and the lamp inside is broken
      answers:
        describesIssue: { noul: 0.81 }
      expect: { kind: filled, value: the box arrived crushed and the lamp inside is broken, display: your description, displays: { es: "your description" } }
    - text: I want to talk about my order
      answers:
        describesIssue: { noul: 0.3 }
      expect: { kind: absent }

- name: words as the display
  about: A short phrase that is not sensitive, shown as said and kept in the trace.
  slot: reference
  config:
    what: a short reference phrase for the booking
    say: null
    redact: none
    maxLength: 60
  utterances:
    - text: blue heron on the lake
      answers:
        referenceGiven: { noul: 0.95 }
      expect: { kind: filled, value: blue heron on the lake, display: blue heron on the lake, displays: { es: "blue heron on the lake" } }

- name: picking the value out of the words
  about: "pick: code splits the words into candidate parts, a second question chooses which part is the street address, and the value is that part as said. None of these, a choice below SLOT_DETECT, or words that make one candidate keep the whole words. French is split with the slot's own words; in a Spanish session an English sentence is one clause, so it keeps the whole words."
  slot: place
  config:
    what: where the problem is
    say: null
    redact: none
    maxLength: 200
    pick:
      what: the street address
      words:
        fr: { joiners: [et, parce que], prepositions: [au, à, près de] }
  utterances:
    - text: the power is out at 22 Alder Street and nothing works
      answers:
        placeGiven: { noul: 0.92 }
        placePick: { choice: { a: 0.05, b: 0.9, c: 0.01, none: 0.04 } }
      expect: { kind: filled, value: 22 Alder Street, display: 22 Alder Street, confirm: none, displays: { es: "the power is out at 22 Alder Street and nothing works" } }
    - text: my lights are out at home and next door too
      answers:
        placeGiven: { noul: 0.7 }
        placePick: { choice: { a: 0.04, b: 0.06, c: 0.02, none: 0.88 } }
      expect: { kind: filled, value: my lights are out at home and next door too, display: my lights are out at home and next door too }
    - text: it is near the old mill by Cedar Road
      answers:
        placeGiven: { noul: 0.9 }
        placePick: { choice: { a: 0.08, b: 0.5, c: 0.4, none: 0.02 } }
      expect: { kind: filled, value: it is near the old mill by Cedar Road, display: it is near the old mill by Cedar Road }
    - text: 200 Heron Row
      answers:
        placeGiven: { noul: 0.95 }
      expect: { kind: filled, value: 200 Heron Row, display: 200 Heron Row }
    - text: Yes, at 14 Birch Lane. By the school.
      answers:
        placeGiven: { noul: 0.93 }
        placePick: { choice: { a: 0.01, b: 0.1, c: 0.85, d: 0.01, e: 0.01, none: 0.02 } }
      expect: { kind: filled, value: 14 Birch Lane, display: 14 Birch Lane }
    - text: sorry, one moment, the kids, the dog, the noise, okay, right, well, it is 9 Quarry Hill
      answers:
        placeGiven: { noul: 0.9 }
        placePick: { choice: { a: 0.02, h: 0.03, none: 0.95 } }
      expect: { kind: filled, value: "sorry, one moment, the kids, the dog, the noise, okay, right, well, it is 9 Quarry Hill", display: "sorry, one moment, the kids, the dog, the noise, okay, right, well, it is 9 Quarry Hill" }
    - text: se fue la luz en la calle Alder 22 y nada funciona
      context: { locale: es }
      answers:
        placeGiven: { noul: 0.9 }
        placePick: { choice: { a: 0.06, b: 0.9, c: 0.01, none: 0.03 } }
      expect: { kind: filled, value: la calle Alder 22, display: la calle Alder 22 }
    - text: la panne est au 22 rue Alder et rien ne marche
      context: { locale: fr }
      answers:
        placeGiven: { noul: 0.9 }
        placePick: { choice: { a: 0.05, b: 0.91, c: 0.01, none: 0.03 } }
      expect: { kind: filled, value: 22 rue Alder, display: 22 rue Alder }
    - text: the lights flicker at night
      answers:
        placeGiven: { noul: 0.2 }
        placePick: { choice: { a: 0.1, b: 0.1, none: 0.8 } }
      expect: { kind: absent }
