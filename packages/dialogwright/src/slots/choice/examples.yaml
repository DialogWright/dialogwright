# Examples of the `choice` slot type: configurations, and what a caller might say to each.
# `answers` are the model's answers to the slot's questions, by question id (a slot reads the
# answers, not the words); `expect` is the outcome the slot must give; `keypad` lists keys and the
# value they give (null: keys that are no value). The conformance kit runs every utterance and key
# here, and the type's docs page shows them.

- name: delivery speed
  about: Three options with their own display and a keypad. The model is told each option means "The caller names <what it says>", and chooses by the keys.
  slot: speed
  config:
    keypad: true
    options:
      standard: { say: standard delivery }
      express: { say: express delivery }
      next_day: { say: next-day delivery }
  utterances:
    - text: next day please
      answers:
        speed: { choice: { next_day: 0.93, express: 0.04, none: 0.03 } }
      expect: { kind: filled, value: next_day, display: next-day delivery, confirm: none }
    - text: whichever is cheapest
      answers:
        speed: { choice: { standard: 0.5, express: 0.3, none: 0.2 } }
      expect: { kind: absent }
    - text: I have a question about my order
      answers:
        speed: { choice: { none: 0.95, standard: 0.05 } }
      expect: { kind: absent }
    - text: overnight
      answers:
        speed: { choice: { overnight: 0.9, none: 0.1 } }
      expect: { kind: absent }
  keypad:
    - digits: "1"
      expect: { value: standard, display: standard delivery }
    - digits: "3"
      expect: { value: next_day, display: next-day delivery }
    - digits: "4"
      expect: null
    - digits: "0"
      expect: null

- name: branch
  about: The shorthand (a bare string for what the option says), with a question of its own and no keypad.
  slot: branch
  config:
    instructions: Read asr.text. Which library branch does the caller name?
    options:
      north: North
      riverside: Riverside
      old_mill: Old Mill
  utterances:
    - text: the Riverside one
      answers:
        branch: { choice: { riverside: 0.9, north: 0.06, none: 0.04 } }
      expect: { kind: filled, value: riverside, display: Riverside }
    - text: the one by the old mill
      answers:
        branch: { choice: { old_mill: 0.82, none: 0.18 } }
      expect: { kind: filled, value: old_mill, display: Old Mill }
    - text: the main library
      answers:
        branch: { choice: { none: 0.9, north: 0.1 } }
      expect: { kind: absent }

- name: colour
  about: Every text in its own words (`means` on an option, `none`, a template for the rest, a question id kept), a stricter threshold, and a keypad.
  slot: colour
  config:
    instructions: Read asr.text alone. Which colour of case does the caller want?
    means: A request for the {key} case, said as {say}
    none: Names no colour of case
    fillAt: SLOT_CHOICE_CONFIRM
    keypad: true
    ids:
      choice: caseColour
    options:
      black: black
      white: { say: white, means: "White, or ivory, or cream" }
      green: { say: forest green }
  utterances:
    - text: the white one, I think
      answers:
        caseColour: { choice: { white: 0.62, black: 0.3, none: 0.08 } }
      expect: { kind: filled, value: white, display: white, confirm: none }
    - text: I do not mind
      answers:
        caseColour: { choice: { white: 0.4, black: 0.35, none: 0.25 } }
      expect: { kind: absent }
    - text: forest green
      answers:
        caseColour: { choice: { green: 0.95, none: 0.05 } }
      expect: { kind: filled, value: green, display: forest green }
  keypad:
    - digits: "2"
      expect: { value: white, display: white }
    - digits: "9"
      expect: null
