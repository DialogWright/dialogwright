# yaml-language-server: $schema=../../../../../schemas/policy.schema.json
# The valid fixture's policy (../../valid/policy.yaml), written in the new shape. What the old file
# says and no rule reads cannot be written here, so it is dropped: the subject and the service
# fields of cancelAppointment (it runs neither scope nor fields), and the roles of findAppointment
# and cancelAppointment with their reason (neither runs the role rule).
actions:
  findAppointment:
    say: find an appointment
    level: 0
    rules:
      - identity
      - scope: { record: bookingId }
  bookAppointment:
    say: book an appointment
    level: 0
    rules:
      - identity
      - confirmed: [name, dob, provider, date, time]
      - custom: no-double-booking
  cancelAppointment:
    say: cancel an appointment
    level: 0
    rules:
      - identity
      - confirmed: [name, dob, provider, date, time]
  verifyPatient:
    level: 0
    rules: [identity, attempts]
  sendCode:
    level: 1
    rules: [identity]
  verifyCode:
    level: 1
    rules: [identity, attempts]

purposes:
  appointment: { level: 0 }

wording:
  scope:
    subject:
      record: The booking belongs to this patient
      param: The patient is the caller
    delegate:
      record: The booking belongs to a patient of this clinic
  recordOwner: booking owner
  subject: patient
  role:
    allow: "{role} may use {tool}"
    refuse: "{role} may not use {tool}"
    person: "{tool} by {role} goes to a person"
