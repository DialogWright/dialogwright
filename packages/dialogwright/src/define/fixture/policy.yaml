# yaml-language-server: $schema=../../../schemas/policy.schema.json
actions:
  renewLoan:
    level: 0
    rules:
      - identity
      - confirmed: [book]
  findHold:
    level: 0
    rules:
      - identity
      - custom: known-branch
  listLoans:
    level: 0
    rules: [identity]
# How each value an action is sent is recorded, where it is not a slot with a redact setting (the
# card number is recorded by its last four, as its slot says).
audit:
  book: keep
  branch: keep
