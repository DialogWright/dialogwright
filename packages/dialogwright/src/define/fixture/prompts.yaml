# yaml-language-server: $schema=../../../schemas/prompts.schema.json
prompts:
  # The opening lines and the engine's own lines
  greeting:
    text: Thanks for calling Example Town Library. I can renew a book or check a hold. How can I help?
    interruptible: true
  greeting_chat:
    text: Hi, this is Example Town Library. I can renew a book or check a hold. What can I help with?
    interruptible: true
  ask_intent:
    text: How can I help you today?
    interruptible: true
  nomatch_open:
    text: Sorry, I didn't catch that. You can ask to renew a book or check a hold.
    interruptible: true
  nomatch_dtmf_menu:
    text: Let's try the keypad. To renew a book press 1. To check a hold press 2. To speak with someone press 0.
    interruptible: true
  no_input:
    text: I didn't hear anything.
    interruptible: false
  ack_intent:
    text: Sure, I can help you {intentLabel}.
    interruptible: false
  confirm_intent_explicit:
    text: Just to check, do you want to {intentLabel}? Yes or no.
    interruptible: false
  disambiguate_intent:
    text: Do you want to {a}, or {b}?
    interruptible: true
  ack_intent_then:
    text: Sure, I can help you {a}, and then {b}.
    interruptible: false
  ack_queued:
    text: Sure, we'll {intentLabel} after this.
    interruptible: false
  bridge_next:
    text: Now, let's {intentLabel}.
    interruptible: false
  ack_frustration:
    text: I understand, let's get this sorted.
    interruptible: false
  offer_transfer:
    text: Would you like me to connect you to a librarian, or keep going?
    interruptible: true
  ack_declined:
    text: Okay, let's keep going.
    interruptible: false
  system_slow_dtmf_hint:
    text: Sorry for the delay. You can also use your keypad.
    interruptible: true
  system_slow_chat:
    text: Sorry, I'm having trouble on my end. Please send that again.
    interruptible: true
  ask_change:
    text: What should I change?
    interruptible: true
  confirm_dtmf:
    text: Press 1 to confirm, or 2 to change something.
    interruptible: false
  anything_else:
    text: Is there anything else I can help with?
    interruptible: true
  goodbye:
    text: Goodbye.
    interruptible: false
  goodbye_chat:
    text: Thanks for chatting with Example Town Library. Goodbye.
    interruptible: false
  screen_reprompt:
    text: I can help you renew a book or check a hold.
    interruptible: true
  screen_reprompt_form:
    text: Let's keep going.
    interruptible: true
  handoff_live_agent:
    text: One moment while I connect you to a librarian.
    interruptible: false
  handoff_frustrated:
    text: Let me get you to someone who can help.
    interruptible: false
  handoff_max_attempts:
    text: Let me get someone to help you with that.
    interruptible: false
  handoff_system_failure:
    text: I'm having trouble right now. Let me connect you to someone.
    interruptible: false
  handoff_needs_human:
    text: This one needs a person. Let me connect you to a librarian.
    interruptible: false
  handoff_security:
    text: Let me connect you to someone who can help.
    interruptible: false

  # The informational intent
  hours:
    text: Every branch is open from nine to six, Monday to Saturday.
    interruptible: true

  # The slots
  ask_book:
    text: Which book is it?
    interruptible: true
  ask_book_retry:
    text: Sorry, which book? For example, The River Atlas.
    interruptible: true
  ask_branch:
    text: Which branch is the hold at, North or Riverside?
    interruptible: true
  ask_branch_retry:
    text: Sorry, is the hold at the North branch or the Riverside branch?
    interruptible: true

  # The forms
  confirm_renew:
    text: You'd like to renew {book} for two more weeks. Shall I do that?
    interruptible: true
  renewed:
    text: Done. {book} is now due back {due}.
    interruptible: false
  hold_ready:
    text: Good news, {book} is waiting for you at the {branch} branch.
    interruptible: false
  hold_waiting:
    text: '{book} is on hold for you at the {branch} branch, but it has not come in yet.'
    interruptible: false
  no_hold:
    text: I don't see a hold for {book} at the {branch} branch.
    interruptible: false

  # Checking loans: the library card slot and the form's lines
  ask_card:
    text: What's your library card number?
    interruptible: true
  ask_card_retry:
    text: Sorry, what's your library card number? Please say it one digit at a time.
    interruptible: true
  ask_card_length:
    text: A library card number has eight digits. Please say all eight, one at a time.
    interruptible: true
  ask_card_dtmf:
    text: Please enter your eight digit library card number on the keypad.
    interruptible: true
  ack_card:
    text: That's card {card}.
    interruptible: false
  next_due:
    text: On card {card}, {book} is due back next, on {due}.
    interruptible: false
  no_loans:
    text: There is nothing checked out on card {card}.
    interruptible: false
  no_card:
    text: I can't find library card {card}.
    interruptible: false
