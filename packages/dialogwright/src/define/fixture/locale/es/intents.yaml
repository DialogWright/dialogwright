# labels; the criteria stay as intents.yaml has them, since the model reads them as written.
intents:
  renew_loan:
    label: renovar un libro
  check_hold:
    label: revisar una reserva
  check_loans:
    label: revisar sus préstamos
  done:
    label: terminar
