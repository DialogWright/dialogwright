name: Many servers

# pnpm multi:test: this repository's image of an app built, and the compose stack started (Postgres, an
# S3-compatible store, two app servers and an HAProxy balancer, deploy/compose/docker-compose.yml); the
# takeover driver places carrier calls through the balancer and kills, then stops, the server holding
# each, and checks that the other takes it over with nothing lost. It builds an image and pulls several,
# so it runs weekly and by hand, not on every push. The stack's logs are kept when it fails or is cancelled.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm multi:test
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-test-logs
          path: deploy/compose/logs/
          retention-days: 14
          if-no-files-found: ignore
