name: Adoption

# pnpm adopt:test: the packages built and packed, a project of its own made outside the workspace with
# the packed create-dialogwright, installed from the tarballs (third-party packages from the
# registry), and its check, type check, tests and stub regression run. Slower than CI and reaching the
# registry, so it runs weekly and by hand, not on every push.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adopt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm adopt:test
