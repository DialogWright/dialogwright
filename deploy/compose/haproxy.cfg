# The balancer of the two-server stack (docker-compose.yml), and the settings a deployment's balancer
# needs (guide 14.14): every server checked on /ready (a draining server answers 503 and is sent nothing
# new), round robin with no stickiness (a carrier's webhooks are stateless, and the server a call's
# socket reaches takes it), WebSockets passed through, and an idle timeout on them longer than the
# longest call.
global
  log stdout format raw local0

resolvers docker
  # Docker's own DNS: a server started again may come back at another address.
  nameserver dns 127.0.0.11:53
  hold valid 1s

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # A call's socket may be quiet between turns: allow far longer than any call.
  timeout tunnel 2h
  timeout client-fin 5s
  # A request that could not reach a server (one that just died) is sent to another.
  retries 3
  option redispatch 1

frontend voice
  bind :8080
  default_backend servers

backend servers
  balance roundrobin
  option httpchk
  http-check send meth GET uri /ready
  http-check expect status 200
  default-server check inter 500ms fall 1 rise 2 resolvers docker init-addr last,libc,none
  server app-a app-a:3000
  server app-b app-b:3000
