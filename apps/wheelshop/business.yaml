# yaml-language-server: $schema=../../packages/dialogwright/schemas/business.schema.json
# Example Wheel Works: everything about the shop the line may use. The engine builds the app from this
# file (its intents, forms, slots, prompts, policy and identity), and the agent model leads the
# conversation from it. The file is invented: no real business, place, person or number.
#
# The demo is a real, working example, so it needs answers only the owner can give. Where it needs one,
# the file makes a reasonable assumption, marked "assumption: the owner corrects these". When the owner
# hears something that isn't how the shop works, the fix is an edit to this file, never to code (DESIGN.md,
# "The demo's assumptions"). After an edit: pnpm check, then pnpm policy:matrix, policy:card and
# app:diagram for this folder, read as a change in what the line may do.
business:
  name: Example Wheel Works
  says: Example Wheel Works
  kind: wheel repair and refinishing
  # The line speaks as the business ("we", "the shop"), never as a named person (the maintainer's
  # call 44): no owner's name, so nothing pushes the model toward talking about one.
  voice: >-
    Friendly, professional and confident, like the front desk of a well-run shop. Speaks for the
    shop as "we". Short sentences. Glad to help, never pushy. Talks about wheels and nothing else.
  # The owner's sample replies, sent to the model as examples of tone, never as facts or rules. Measured
  # on 2026-11-09 (pnpm agent:bakeoff): with them, no reply held a figure the facts don't; without them, three.
  examples:
    - Oh, that's no fun. Good news, curb rash is something we see every day. What are you driving?
    - Diamond cut, nice. Those come up great on our lathe.
    - We can't do cracked ones, sorry. A cracked wheel needs replacing. Anything else going on with it?
    - You're in the right place. Let's get you sorted.

services:
  - name: curb rash repair
    about: Scrapes and gouges on the rim's edge from a curb.
  - name: scratch and scuff repair
  - name: face damage repair
  - name: diamond cut wheel refinishing
    about: >-
      For wheels whose face is bright bare metal with fine machined lines, often two-tone. Cut on a
      lathe in the shop, with the tyre left on.
  - name: refinishing worn or faded finishes
notOffered: # assumption: the owner corrects these
  - cracked wheels
  - straightening bent wheels
  - tyres, paint, headlights or anything that isn't a wheel

claims: # the only reassurance the line may give (the drift judge holds it here)
  - Most curb rash and scratches can be fixed.
  - We see this kind of damage every day.
  - Diamond cut wheels are what our lathe is for.
  - Curb rash on a diamond cut wheel is usually a same-day fix. # assumption: the owner corrects these
  - Dealerships on Commerce Drive send their trade-ins here.
  - Dealership work is billed at the rates agreed with the shop. # assumption: the owner corrects these

prices: # assumption: the owner corrects these (the shop quotes every retail job from a photo)
  quote: from a photo # no figures: the line never says a price
  # Said in these words when a caller asks about price. It promises no text before the request is
  # confirmed: the text asking for a photo is sent by the request's read-back's yes (send_photo_link), and
  # only to a caller who said yes to being texted, so the line says what happens once the request is in,
  # never that a text is on its way, and never how (a live call heard the steps twice, here and in the done
  # line said straight after, which says them by the caller's choice of a text or a call).
  say: >-
    We quote every job from a photo, because the price depends on the damage. Once your request is
    in, we'll ask you for one.
  # The price line is for a retail caller's request only: a dealership's booking is billed at the rates
  # agreed with the shop (a claim), so in the booking the model may not name it (assumption: the owner corrects these).
  forms: [request]

where:
  place: inside the detailing shop at 400 Commerce Drive, Rivergate
  mobile: false # assumption: the owner corrects these (the work is done at the shop)
days: [monday, tuesday, wednesday, thursday, friday] # assumption: the owner corrects these
windows: # assumption: the owner corrects these (drop-off windows, each with room for some cars)
  - name: morning
    says: drop off by 8 in the morning, ready by about noon
    capacity: 3
  - name: afternoon
    says: drop off by noon, ready by about 5
    capacity: 3

accounts: # regular dealership accounts, booked straight in, recognized by the number they call from
  - name: Rivergate Motors
    # env.DEALER_TEST_LINE: a tester's own phone, set privately on a host (the app's settings, never this
    # file), so the dealer flow can be heard on a real call. Unset, it is left out with a note as the server starts.
    numbers: ["+15555550142", "+15555550143", "env.DEALER_TEST_LINE"]
  - name: Northside Auto Sales
    numbers: ["+15555550150"]
  - name: Lakeview Imports
    numbers: ["+15555550161"]

# What each tool does, in a few words: the action's description on the policy card, the console and the audit.
tools:
  request: send the shop the request
  send_photo_link: text the caller asking for a photo of the damage, only with their consent
  notify_owner_request: text the shop a summary of the request
  book: book the cars into the drop-off window
  notify_owner_booking: text the shop a summary of the booking
  callback: leave the shop a callback note
  availability: read the free drop-off windows on a day

# What a retail caller's request collects. The shop quotes from a photo and confirms the window with the quote
# (assumption: the owner corrects these), so the request takes no room in a window.
request:
  about: a retail caller's request, sent to the shop, which quotes from a photo and confirms the drop-off window
  label: send a request
  fields:
    - name: callerName
      type: name
      question: What's your name?
    - name: vehicle
      type: text
      about: The car as the caller names it (a make alone is enough), with its model and year where they give them.
      question: What car is it?
    - name: wheels
      type: choice
      options: [one, two, three, four]
      about: How many wheels need work.
      question: How many wheels need work?
    - name: damage
      type: text
      # Short, in the caller's own terms: the read-back says it after "damage:", so any short phrase reads (a recording
      # held "scraped my wheel on a curb pulling into a parking garage", too long to read back; calls 51 and 58 read
      # "a ... Kia Sorento with curbed and scraped up" and "a Infinity with scraped up" through the old frame, "a
      # {vehicle} with {damage}", which needed an article and a noun). No example phrase here: one the caller never
      # said ("on the rim") was copied into a value, and refused.
      about: What the damage is, as the line understood it, a few words in the caller's own terms (not a whole sentence), since the read-back says it after "damage:".
      question: What happened to the wheel?
    - name: diamondCut
      type: choice
      options: ["yes", "no", not sure]
      # By the shop's own facts a two-tone face (bright machined metal with painted sections) is diamond cut: a live
      # call took "shiny, but it also has painted sections too" as not sure (call 51).
      about: >-
        Whether the wheel's face is diamond cut: bright bare machined metal with fine lines. A face that is
        bright machined metal with painted sections between, two-tone, is diamond cut too; only a face
        painted all over is not.
      question: Is the face of the wheel shiny bare metal with fine lines, or painted all over?
      optional: true
      # Said in the read-back in these words (the request sends it to the shop, so the caller confirms it), and
      # "unset" when the caller never said.
      says: { "yes": diamond cut, "no": not diamond cut, not sure: not sure if diamond cut, unset: not sure if diamond cut }
    - name: day
      type: date
      about: The day the car is dropped off ("tomorrow" or a weekday names one).
      question: What day would you like to drop it off?
      sees: availability # the windows free on that day reach the model (the maintainer's decision 2)
    - name: window
      type: choice
      options: windows # morning or afternoon, from windows
      # A window the day's free windows do not list is refused, and the model asked again with them, so the
      # line never takes, or promises, a window that is full.
      freeFrom: availability.windows
      # Said, before the question, when the window asked for is full that day and the other has room (call 54: a
      # live call asked for Friday morning three times and heard only "Morning or afternoon?"). Where neither has
      # room, the engine's "We're full on {day}." and the day is asked again.
      # Where only one window is left, the question after it asks for that one (call 55: "...we have room in the
      # afternoon. Morning or afternoon?" sounded odd); a yes takes it.
      full:
        some: "{day} in the {window} is full, but we have room in the {free}."
        ask: Does the {free} work for you?
      question: Morning or afternoon?
    - name: callbackNumber
      type: digits
      length: 10
      offer: callerNumber
      countryCode: "1"
      question: What's the best number to reach you?
    # The caller's consent to be texted at that number (the maintainer's decision, 2026-11-08): the text asking
    # for a photo goes only with a yes (the `when` below, a rule of the gate). Read back in the shop's words.
    - name: textOk
      type: choice
      options: ["yes", "no"]
      about: Whether the caller agrees to be texted at their callback number, as they answered when asked if we may text them.
      question: Is it OK if we text you at that number?
      says:
        "yes": { readBack: "and we'll text you at", done: "Reply to our text with a photo of the damage, and we'll text you a price and confirm your drop-off." }
        "no": { readBack: "and we'll call you at", done: "We'll call you about a price and to confirm your drop-off." }
  # Every field is said, the optional diamondCut by its own words (says), since every field is sent to the shop:
  # the caller confirms nothing they never heard. The consent is said by its own words too. Each text field is
  # framed so any car name and any short damage phrase read naturally ("your Infinity", "damage: scraped up"):
  # the old frame, "a {vehicle} with {damage}", read "a Infinity with scraped up" on call 58.
  readBack: >-
    Here's your request: {callerName}, your {vehicle}, damage: {damage}, on {wheels} of its wheels,
    {diamondCut}, hoping to drop it off {day} in the {window}, {textOk} {callbackNumber}.
    Is that right?
  # The request first (the form's write), then the text asking for a photo (only with the caller's yes to
  # being texted: with a no the gate refuses it, and the request goes on without it) and the shop's summary.
  then:
    - request
    - { tool: send_photo_link, when: { field: textOk, is: "yes", reason: no-consent } }
    - notify_owner_request
  # No name: the read-back has just said it, and "Thanks, <full name>" sounded stiff on a live call.
  done: Thanks, we have your request. {textOk}
  # Asked where the caller says at the read-back they don't want to go ahead ("never mind", call 55): a yes
  # ends the call with nothing sent, a no reads the request back. The engine's words, kept here to be seen.
  cancel: Do you want to cancel this request?

# What a regular account's booking collects: dealerships are booked straight into a window (assumption:
# the owner corrects these). Only a caller the number they call from recognizes as an account may book.
booking:
  for: accounts
  about: a dealership account's booking of cars into a drop-off window
  label: book cars in
  fields:
    - name: cars
      type: choice
      options: [one, two, three, four, five, six]
      about: How many cars they are dropping off.
      question: How many cars?
    - name: vehicles
      type: text
      about: The cars and which wheels, by make and model or stock number.
      question: Which cars are they, and which wheels?
    - name: day
      type: date
      about: The day the cars are dropped off ("tomorrow" or a weekday names one).
      question: What day are you dropping them off?
      sees: availability
    - name: window
      type: choice
      options: windows
      freeFrom: availability.windows # a full window is refused: the booking takes room in it
      full:
        some: "{day} in the {window} is full, but we have room in the {free}."
        ask: Does the {free} work for you?
      question: Morning or afternoon?
  # The cars as the line understood them follow a colon, so any phrase reads (calls 57 to 59: "dropping off
  # {vehicles}" needed a noun phrase, as the request's old frame did).
  readBack: >-
    So that's {account}, {cars} in all: {vehicles}, dropping off {day} in the {window}. Shall I
    book it?
  then: [book, notify_owner_booking]
  done: You're booked for {day}, in the {window}. Thanks.
  cancel: Do you want to cancel this booking?

# A callback note for a caller who wants to speak with someone: there is no live transfer. The handoff
# below says someone from the shop will call back; this form collects the number.
callback:
  about: a callback note for the shop, from a caller who wants to speak with someone
  label: leave a callback note
  fields:
    - name: callbackNumber
      type: digits
      length: 10
      offer: callerNumber
      countryCode: "1"
      question: What's the best number to call you back on?
  readBack: We'll call you back at {callbackNumber}. Is that right?
  then: [callback]
  done: Thanks. Someone from the shop will call you back as soon as they can.
  cancel: Do you want to cancel this callback note?

# A statement: it is said where nothing waits for an answer, and the callback form asks for the number.
handoff: Someone from the shop will call you back as soon as they can.
closing: Thanks for calling Example Wheel Works.

lines:
  booking_for_accounts: Bookings are for our dealership accounts, but we can take a request instead.
  identity_not_recognized: That's for our dealership accounts, recognized by the number they call from.

owner: # assumption: the owner corrects these (a text summary of every request and booking)
  # Texted to the shop's phone, the app's own setting SHOP_PHONE (never in this file); printed while it is
  # unset or the server has no sender (TEXT_FROM).
  notify: text
  summary: >- # a fixed template, filled by the app's own tools: never a generated line
    New {kind} from {who} ({callbackNumber}): {details}. Drop-off: {day}, {window}.

# The texts the app's own code sends, in the shop's fixed words (never a generated line, never said on a call),
# with the placeholders the code fills. A caller's own text forwarded to the shop follows its line after a colon.
texts:
  # To the caller, once the request is confirmed and only with their yes to being texted. The first text to a
  # number says how to opt out (assumption: the owner corrects these; Twilio answers STOP itself).
  photoRequest: Thanks for your request with Example Wheel Works. Reply to this text with a photo of the damaged wheel and we'll send you a price. Reply STOP to opt out.
  # To the caller, when their photo has come in, only where their request said yes to being texted.
  photoThanks: Got it, thanks. We'll text you a price soon.
  # To the shop's phone (SHOP_PHONE), with the caller's photos attached.
  photoForward: Photo from {name}, ...{last4}, for their {vehicle} request.
  # To the shop's phone: a text with no photo from a caller with a request on file.
  textForward: Text from {name}, ...{last4}, about their {vehicle} request.
  # To the shop's phone: a text from a number with no request on file, photos attached.
  unknownForward: Text from ...{last4} (no request on file).
  # To the shop's phone: a callback note.
  callbackNote: "Call back {number} (callback note {ref})."
  # Quote and confirm (DESIGN.md "Quote and confirm"): the shop quotes a request from its page, the customer replies to
  # book. Sent only to a request whose caller said yes to texts. {wheels} is "wheel" or "two wheels", {price} "$180",
  # {day} "Tuesday, Nov 10", {window} the window's own words (windows' says), {word} the reply word below.
  quote: "Example Wheel Works: your quote for the {wheels} on your {vehicle} is {price}. We can take it {day}, {window}. Reply {word} to book it."
  # The word the customer replies to book (assumption: the owner corrects these). Not YES, which Twilio takes as an
  # opt-in keyword. Read by the decision model, not matched: "confirm", "yes confirm" or "sounds good, book it" count.
  confirmWord: CONFIRM
  # To the customer, once their reply has booked the window.
  booked: "You're booked with Example Wheel Works for {day}, {window}. Thanks, see you then."
  # To the shop's phone: a reply to a quote that does not book it, the customer's words after a colon; the hold stays.
  quoteReply: "Reply from {name}, ...{last4}"
  # To the shop's phone: a reply that booked the window ({window} the window's name, {booking} its reference).
  quoteBooked: "Booked from quote {ref}: {name}, ...{last4}, {vehicle}, {day}, {window}, {price} ({booking})."
  # Added to quoteBooked where the customer's booked text did not go ({status}: limited, failed, refused or printed).
  customerNotTexted: "Customer not texted ({status}): call them."
  # To the shop's phone: a quote's hold that lapsed with no yes (24 hours after the quote, or 6 pm the day before).
  quoteLapsed: "Quote {ref} for {name}, ...{last4} lapsed with no reply: {day}, {window} is free again."
  # To the shop's phone, the customer's words after a colon: a reply to a quote whose hold lapsed (never read, never
  # booked: the shop calls); and a yes the calendar refuses (a window with no room left under the hold).
  quoteLate: "{name}, ...{last4} replied to quote {ref} after it lapsed, so call them. They wrote"
  quoteFull: "{name}, ...{last4} replied to book quote {ref}, but {day}, {window} is full now, so call them. They wrote"
  # To the customer, only where the shop ticks "text them" as it withdraws a quote from its page (by default it does not).
  quoteWithdrawn: "Example Wheel Works: we've withdrawn your quote for the {wheels} on your {vehicle}. We'll be in touch."

