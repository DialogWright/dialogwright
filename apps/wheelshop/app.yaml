# yaml-language-server: $schema=../../packages/dialogwright/schemas/app.schema.json
# Example Wheel Works: a fictional wheel repair shop's line, in agent mode. A model leads the
# conversation from the shop's facts (business.yaml): it greets, reassures from the approved claims and
# asks for what a request or a booking needs in whatever order fits. The engine checks every value it
# understands by its slot type, says every read-back in the shop's fixed words, and gates every action.
# The app has no intents.yaml, forms.yaml, prompts.yaml, slots.yaml, policy.yaml or identity.yaml: the
# engine builds them from business.yaml. Invented throughout: no real business, place, person or number.
id: wheelshop
locale: en-US
mode: agent

brand:
  name: Example Wheel Works
  mark: EW
  key: wheelshop

voice:
  hints: [curb rash, diamond cut, rim, wheel, wheels, refinishing, lathe, two-tone, BMW, trade-ins, Rivergate, Commerce Drive]

# The chat page (a browser tab at /wheelshop), public, so the demo can be tried without a phone line. A chat
# carries no number calling, so a dealership's booking (recognized by caller ID) is a phone call's only:
# on the chat every caller sends a request.
chat:
  page:
    serve: public
    intro: |
      Example Wheel Works is an invented one-person wheel repair shop, answered by DialogWright's agent mode: a model words the conversation from the shop's facts, every value is checked, and nothing is sent until you confirm the read-back. Try describing some curb rash, ask whether your wheel is diamond cut, or push for a price. The shop's hours, windows and turnaround are demo assumptions.

# The console's header: a button that opens the shop page (src/shopPage.ts, /wheelshop/shop): the requests,
# bookings, texts and callback notes the line took in, served as the console is (on this machine, or behind
# the console's sign-in with CONSOLE_AUTH=token).
console:
  links:
    - id: shop
      label: Shop
      title: "What the line took in: requests, bookings, texts and callback notes"
      href: /wheelshop/shop
      target: wheelshop-shop
      features: width=480,height=900

fixtures:
  dir: fixtures

testing:
  adversarial: on
