# yaml-language-server: $schema=../../packages/dialogwright/schemas/style.schema.json
# The model that leads the conversation: Meta's Muse Ember on Meta's own API (provider: meta, key
# META_API_KEY), in Standard mode (which does not train on what it is sent), at its least reasoning (instant,
# sent as reasoning_effort minimal: a Muse model always reasons). Inception shuts Mercury 3, the model before,
# down on 2026-12-28. Measured on 2026-11-18 with pnpm agent:bakeoff on this app's cases
# (fixtures/agent/cases.yaml), with the owner's sample replies: valid JSON 100%, values right 100% (24 of 24;
# Mercury 3 at instant 83%), no reply with a figure the facts do not hold, actions right 100%, p50 1048 ms /
# p95 1647 ms (Mercury 508 / 852), at about two thirds of Mercury's cost. Slower than the bar for a call
# (p50 1.0 s, p95 1.8 s, with the drift judge); nothing measured is as fast as Mercury.
agent:
  provider: meta
  model: muse-ember-1.0
  effort: instant
# The most words a reply of the model's may use (a longer one is not said: the field's fixed question
# is). On a call 30, over the engine's 25: the warm opening the demo wants, as the bake-off's cases
# give it (fixtures/agent/cases.yaml: "Oh, that's no fun. Most curb rash can be fixed, ... What car is
# it?"), runs to 26 words. In a chat, the engine's default.
words:
  voice: 30
