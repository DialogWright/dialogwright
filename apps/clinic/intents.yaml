# yaml-language-server: $schema=../../packages/dialogwright/schemas/intents.schema.json
# What a caller can ask the clinic line for, in the order the decision model is offered them, and
# the keypad menu. Each criteria line is sent to the model as it is written: a change re-keys the
# recorded cassette (fixtures/recorded). Each label is said in acknowledgements and confirmations
# ("I'd be happy to help you {label}").
intents:
  # The five tasks, one form each (forms.yaml), and a general question
  schedule_new:
    criteria: Wants to book a new appointment that does not exist yet
    label: schedule a new appointment
    kind: form
  reschedule:
    criteria: Wants to move an existing appointment to a different day
    label: reschedule your appointment
    kind: form
  cancel:
    criteria: Wants to cancel an existing appointment
    label: cancel your appointment
    kind: form
  confirm_appointment:
    criteria: Wants to check or confirm the details of an existing appointment
    label: confirm your appointment
    kind: form
  billing:
    criteria: Asks about a bill, charge, payment, or insurance coverage
    label: talk to billing
    kind: form
  # A general question, answered from the knowledge base (kb/): the topic slot asks which topic,
  # among those retrieval nominates for the words, and the approved passage is said word for word.
  # The criteria name the five topics the knowledge base answers, not every question about the
  # practice: one it cannot answer (where it is, flu shots, records) stays `other`.
  ask_question:
    criteria: Asks about the practice's opening hours, parking, what to bring to a first visit, the cancellation policy, or accessibility, or says they have a question without saying what it is
    label: get an answer to your question
    kind: form

  # The engine's own
  agent:
    criteria: Asks to speak with a person, representative, or operator
    label: speak with someone
    kind: control
  repeat_prompt:
    criteria: Asks the system to repeat what it just said
    label: hear that again
    kind: control
  # The caller is finished: the call ends with the goodbye. A task ends the call on its own line, so
  # this is heard at the intent question (after the capabilities line, say) and at "anything else?",
  # which the engine asks when a form is done and the call goes on.
  done:
    criteria: Says they are finished and need nothing more, as in no thanks, that's all, I'm all set, nothing else, I don't need anything else, or goodbye, including a bare no when just asked whether there is anything else
    label: finish up
    kind: control

  # Informational: its line is said, and the caller goes back to the question they were on
  capabilities:
    criteria: Asks what the system can do, what it is, what the options are, or how to use it, as in what can you do, what are my options, or what is this
    label: hear what I can do
    kind: informational
    promptId: capabilities

  other:
    criteria: A request the clinic line does not handle
    label: something else
    kind: control
  none:
    criteria: No request is expressed; the caller is only answering a question or saying something incidental
    label: nothing
    kind: control

# The keypad menu: each task by digit, and 0 for a person. A general question has no key: it needs words.
menu:
  - digit: "1"
    intent: schedule_new
  - digit: "2"
    intent: reschedule
  - digit: "3"
    intent: cancel
  - digit: "4"
    intent: confirm_appointment
  - digit: "5"
    intent: billing
  - digit: "0"
    intent: agent
