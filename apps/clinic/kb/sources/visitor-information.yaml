document: Visitor information
provenance:
  file: docs-src/visitor-information.md
  retrieved: 2026-10-13
sections:
  opening-hours:
    heading: Opening hours
    text: Example Family Practice is open Monday through Friday from 8 a.m. to 5 p.m. We are closed on weekends and public holidays. The first appointments of the day start at 8:30 a.m. and the last at 4:15 p.m.
  parking:
    heading: Parking
    text: Parking is free in the lot behind the building, with its entrance on Example Lane. The spaces next to the door are kept for patients with a disability parking permit. The lot is open whenever the practice is open.
  your-first-visit:
    heading: Your first visit
    text: Please arrive 15 minutes before your first appointment, so there is time to fill in a short form. Bring a photo ID, your insurance card or member ID card, a list of the medicines you take, and any recent test results from another doctor.
  cancelling-or-changing-an-appointment:
    heading: Cancelling or changing an appointment
    text: If you cannot come, please cancel or reschedule at least 24 hours before your appointment, so that we can offer the time to another patient. You can cancel or reschedule at any time on our phone line, by saying what you need.
  accessibility:
    heading: Accessibility
    text: The building has a step-free entrance and an elevator to every floor, and every exam room is wheelchair accessible. If you need a sign language or spoken language interpreter, tell us when you book and we will arrange one at no cost to you.
  contact:
    heading: Contact
    text: Example Family Practice, 200 Example Avenue, Example City. The front desk answers at 555-0142 during opening hours.
