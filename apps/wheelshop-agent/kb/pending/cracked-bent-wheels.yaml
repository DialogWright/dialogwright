  section: cracked-bent
answer: "We don't repair cracked or bent wheels: a crack or a bend can weaken a wheel, and we won't put back on a car a wheel that may not be safe. A specialist who straightens wheels, or a replacement wheel, is the way to go, and we're happy to refinish a replacement to match the others."
