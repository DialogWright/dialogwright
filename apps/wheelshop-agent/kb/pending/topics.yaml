# yaml-language-server: $schema=../../../../packages/dialogwright/schemas/kb-topics.schema.json
# The topics the demo's drafts propose, waiting for a person to accept (or merge, or rename) each one in pnpm kb:review;
# never read at run time. Two are proposed as risk: low (their approved passage may be worded for the caller's
# question): which topics are low risk is the owner's call. # assumption: the owner corrects these
aftercare:
  title: Caring for a refinished wheel
  keywords: [aftercare, wash, washing, cleaner, cleaning, car wash]
  asks:
    - How do I look after my wheels after the refinish?
    - Can I take it through a car wash?
    - What should I clean the wheels with?
  risk: low
diamond_cut:
  title: What diamond cutting is
  keywords: [diamond cut, diamond cutting, diamond-cut, lathe]
  asks:
    - What does diamond cut actually mean?
    - How do you diamond cut a wheel?
  risk: low
refinish_guarantee:
  title: How long a refinish lasts
  keywords: [guarantee, warranty, last, lasts, peel, peeling, flaking]
  asks:
    - How long will the refinish last?
    - Is there a guarantee on the work?
    - What if the finish starts peeling?
sensors_balancing:
  title: Tyre pressure sensors and balancing
  keywords: [tyre pressure sensor, tire pressure sensor, TPMS, sensor, balance, balancing]
  asks:
    - Will my tyre pressure sensor be okay?
    - Do you balance the wheel after the repair?
cracked_bent:
  title: Cracked or bent wheels
  keywords: [cracked, crack, bent, bend, buckled, straighten, straightening]
  asks:
    - Can you fix a cracked wheel?
    - My wheel is bent, can you repair it?
