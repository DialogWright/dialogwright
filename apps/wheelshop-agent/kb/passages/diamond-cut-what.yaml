source:
  document: shop-notes
  section: diamond-cut
answer: "Diamond cutting is how we bring back a bright metal wheel face. The wheel goes on our lathe and a diamond-tipped tool takes a very thin layer off the face, leaving the fine lines of a new finish, and then a clear coat goes on to protect the bare metal."
