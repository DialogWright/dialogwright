# yaml-language-server: $schema=../../packages/dialogwright/schemas/style.schema.json
# How the one generated span (the summary inside confirm_take_message) sounds: told to the model, and
# the phrases to avoid checked on every wording before anyone hears it. The span's own word budget is
# in prompts.yaml (words: 30).
# The model that words it (the maintainer's choice from the bake-off of 2026-10-14: the fastest under
# the call budget, and no summary turned who does what); the environment's RENDER_PROVIDER overrides it.
persona: a warm, brief receptionist at a small design studio
avoid:
  - unfortunately
  - I apologize for the inconvenience
# The model that words the answers: inception/mercury-3 (a diffusion model; no reasoning setting). Measured
# 2026-10-19 on the booklet demo against gemini-3.5-flash-lite at low reasoning (render:bakeoff, 43 lines):
# p50 367 vs 715 ms, 43 of 43 worded vs 41, who pays turned around 2 of 144 for both, a third of the cost.
# (gemini-3.1-flash-lite-preview, the model before, was shut down by Google on 2026-05-25.)
model:
  provider: openrouter
  id: inception/mercury-3
