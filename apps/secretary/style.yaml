# yaml-language-server: $schema=../../packages/dialogwright/schemas/style.schema.json
# How the one generated span (the summary inside confirm_take_message) sounds: told to the model, and
# the phrases to avoid checked on every wording before anyone hears it. The span's own word budget is
# in prompts.yaml (words: 30).
# The model that words it (the maintainer's choice from the bake-off of 2026-10-14: the fastest under
# the call budget, and no summary turned who does what); the environment's RENDER_PROVIDER overrides it.
persona: a warm, brief receptionist at a small design studio
avoid:
  - unfortunately
  - I apologize for the inconvenience
# The model that words the summary: Meta's Muse Ember, on Meta's own API (provider: meta, key META_API_KEY),
# in Standard mode (which does not train on what it is sent), at its least reasoning (reasoning_effort minimal,
# the default; a Muse model always reasons). Inception shuts Mercury 3, the model before, down on 2026-12-28.
# On this app's own spans (render:bakeoff, 2026-11-18): 39 tried, 8 worded, 27 the message's own words, 4
# refused (drift 2, foreign 2); wording p50 811 ms, p95 1347 ms, 7 of 18 over the 900 ms call budget (a line
# over it is said with the message's own words). Beside it: Mercury 3 18 worded, p50 280 ms, none over;
# Claude Haiku 5.5 14 worded and 23 refused by the judge. DESIGN.md, Recording of 2026-11-18, has the detail.
model:
  provider: meta
  id: muse-ember-1.0
