# yaml-language-server: $schema=../../packages/dialogwright/schemas/style.schema.json
# How the one generated span (the summary inside confirm_take_message) sounds: told to the model, and
# the phrases to avoid checked on every wording before anyone hears it. The span's own word budget is
# in prompts.yaml (words: 30).
# The model that words it (the maintainer's choice from the bake-off of 2026-10-14: the fastest under
# the call budget, and no summary turned who does what); the environment's RENDER_PROVIDER overrides it.
persona: a warm, brief receptionist at a small design studio
avoid:
  - unfortunately
  - I apologize for the inconvenience
# The model that words the summary: Inception's Mercury 3 (a diffusion model), on Inception's own API
# (provider: inception, key INCEPTION_API_KEY), at its fastest reasoning (reasoning_effort instant, the
# default) with realtime on. It was reached through OpenRouter (inception/mercury-3) until OpenRouter
# dropped it, on or before 2026-11-09 (HTTP 404: no provider serves this model anymore), so every line
# fell back on a call. Measured 2026-10-19 on the booklet demo against gemini-3.5-flash-lite at low
# reasoning (render:bakeoff, 43 lines): p50 367 vs 715 ms, 43 of 43 worded vs 41, who pays turned around
# 2 of 144 for both, a third of the cost. (gemini-3.1-flash-lite-preview, the model before, was shut
# down by Google on 2026-05-25.) No temperature is set: Mercury takes only 0.5 to 1.
# On this app's own spans through Inception (render:bakeoff, 2026-11-08): 39 tried, 17 worded, 19 the
# message's own words, 3 fell back; wording p50 280 ms, p95 568 ms, none of 18 over the 900 ms call budget.
model:
  provider: inception
  id: mercury-3
