# yaml-language-server: $schema=../../packages/dialogwright/schemas/forms.schema.json
# Each form: its slots in the order they are asked, the prompt that reads them back for a yes
# (`null` for a form with no summary), and the hooks it has. The hooks are TypeScript in
# src/app.ts (code.forms.<id>); this list must name exactly the ones the code writes. `calls` lists the
# actions the hooks call through the gate.
forms:
  # Who the message is for, who it is from, the number to call back and the message itself, read back
  # for a yes. The read-back is a framed line (prompts.yaml's confirm_take_message): only its summary
  # of the message is generated. A caller who says no hears the message again word for word first
  # (summary.onNo: read-back), and can then say it again. A yes delivers it, word for word, exactly as
  # read back (a confirmed write, see policy.yaml), and the call ends on message_taken.
  take_message:
    slots: [recipient, caller, phone, message]
    summaryPromptId: confirm_take_message
    hooks: [confirmedParams, complete]
    calls: [leaveMessage]
    summary:
      onNo: read-back

  # Urgent: no questions, straight to the studio's main line (the complete hook hands off with the
  # reason urgent, said by handoff_urgent).
  urgent:
    slots: []
    summaryPromptId: null
    hooks: [complete]
    calls: []

  # Whether someone is in: who (the person, the message's own slot, so a message that follows keeps
  # them), then the complete hook reads their status through the gate and says it in a fixed line per
  # status (src/app.ts). What follows is routes.yaml's (afterForm.whereabouts): someone available goes
  # on to reach_person, anyone else to offer_message.
  whereabouts:
    slots: [recipient]
    summaryPromptId: null
    hooks: [complete]
    calls: [personStatus]

  # Someone available: put through to them (the complete hook hands off with the reason put-through, to
  # their own line: app.yaml's transfer targets), or a message for them (routes.yaml's
  # afterForm.reach_person enters take_message, the person kept), or neither ("anything else?").
  reach_person:
    internal: true
    label: put you through or take a message
    slots: [recipient, reachHow]
    summaryPromptId: null
    hooks: [complete]
    calls: []

  # Anyone not available (or the team, or a status the line could not read): a message for them? A yes
  # enters take_message with the person kept (routes.yaml's afterForm.offer_message); a no, "anything
  # else?".
  offer_message:
    internal: true
    label: see about a message
    slots: [recipient, leaveMessage]
    summaryPromptId: null
    hooks: [complete]
    calls: []
