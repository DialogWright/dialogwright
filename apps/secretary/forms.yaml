# yaml-language-server: $schema=../../packages/dialogwright/schemas/forms.schema.json
# Each form: its slots in the order they are asked, the prompt that reads them back for a yes
# (`null` for a form with no summary), and the hooks it has. The hooks are TypeScript in
# src/app.ts (code.forms.<id>); this list must name exactly the ones the code writes. `calls` lists the
# actions the hooks call through the gate.
forms:
  # Who the message is for, who it is from, the number to call back and the message itself, read back
  # for a yes. The read-back is a framed line (prompts.yaml's confirm_take_message): only its summary
  # of the message is generated. A caller who says no hears the message again word for word first
  # (summary.onNo: read-back), and can then say it again. A yes delivers it, word for word, exactly as
  # read back (a confirmed write, see policy.yaml), and the call ends on message_taken.
  take_message:
    slots: [recipient, caller, phone, message]
    summaryPromptId: confirm_take_message
    hooks: [confirmedParams, complete]
    calls: [leaveMessage]
    summary:
      onNo: read-back

  # Urgent: no questions, straight to the studio's main line (the complete hook hands off with the
  # reason urgent, said by handoff_urgent).
  urgent:
    slots: []
    summaryPromptId: null
    hooks: [complete]
    calls: []
