# yaml-language-server: $schema=../../packages/dialogwright/schemas/slots.schema.json
# Every slot the app has, in the order the engine works through them. Each is a library type
# configured here (docs/slots/README.md lists the types and their options).

# Who the message is for, or who the caller asks about (whether they are in, to be put through): one of
# the three people, or anyone at the studio. One slot for both, so a message that follows the question
# keeps the person. The model picks a key from this list; `say` is how the line names it.
recipient:
  type: choice
  options:
    riley:
      say: Riley Moreno
      means: The message is for Riley Moreno, or Riley, or the caller asks about them
    sam:
      say: Sam Okafor
      means: The message is for Sam Okafor, or Sam, or the caller asks about them
    jordan:
      say: Jordan Lee
      means: The message is for Jordan Lee, or Jordan, or the caller asks about them
    anyone:
      say: the team
      means: The caller does not mind who, or asks about no one in particular, as in anyone, whoever is around, the team or the studio
  text:
    instructions: Read asr.text. Who does the caller say the message is for, or ask about?

# The caller's own name, as said.
caller:
  type: name

# A number to call back: on a phone call the line offers the number the caller is calling from, as a
# yes or no ("Is the number you're calling from, ending in 0142, the best one to reach you?"); a no
# asks for another. Recorded by its last four (the digits type's default, redact: last4).
phone:
  type: digits
  noun: phone
  length: 10
  mask: '[2-9]\d{9}'
  keypad: true
  group: [3, 3, 4]
  callerNumber:
    countryCode: '1'

# The message, exactly as the caller said it: the slot keeps the words for the call (say: null), the
# message is delivered word for word, and these words fill the read-back's summary whenever it is not
# generated (a no, a repeat, a check that fails, a slow model). redact: length-summarized (guide 16.3,
# 16.5): the words are sent whole to the render model only to word the read-back's summary, and kept
# by their length in every record. The app keeps no caller's words at all: every caller's words, on
# every turn, are kept by their length in the trace, on the console and in the frame log (so its calls
# cannot be replayed from a frame log, and kb:gaps finds no caller questions), the audit records the
# message by its length, and a handoff hands it over by its length. Chosen deliberately: this app is
# the demo of that setting.
message:
  type: text
  what: the message the caller wants to leave
  instructions: Count the message itself, even when it comes with other words. A request to be called back about something is a message too, and so is one that starts by saying how urgent it is, as in it's not urgent, but the invoice needs a look.
  say: null
  redact: length-summarized
  maxLength: 500
  # The turn at "Go ahead with your message." is the message, whole (the engine's default for a text slot
  # without pick, written out: the owner's choice, live findings item 29): no bar on messageGiven, and
  # nothing said there is acted on as a request, "it's urgent" and "can I talk to someone" included; the
  # read-back follows, and a no lets the caller say it again. `commands: { listen: [urgent, agent] }`
  # would put those through instead.
  commands: ignore

# Someone available: the line said so, and asks whether to put the caller through or take a message
# (reach_person). On the keypad: 1 put through, 2 a message, 3 neither.
reachHow:
  type: choice
  options:
    through:
      say: put you through
      means: Wants to be put through to the person now, as in put me through, connect me, I'll talk to them, yes please put me through
    message:
      say: take a message
      means: Wants to leave a message instead, as in I'll leave a message, just take a message, a message is fine
    neither:
      say: neither
      means: Wants neither, as in no thanks, never mind, I'll call back later
  keypad: true
  text:
    instructions: Read asr.text. The line said the person is available and asked whether to put the caller through or take a message. Which does the caller choose?

# Anyone not available: the line said so, and asks whether the caller would like to leave a message
# (offer_message). On the keypad: 1 yes, 2 no.
leaveMessage:
  type: choice
  options:
    leave:
      say: leave a message
      means: Agrees to leave a message, as in yes, yes please, sure, okay, I'll leave one
    decline:
      say: no message
      means: Declines to leave a message, as in no, no thanks, not now, I'll call back later
  keypad: true
  text:
    instructions: Read asr.text. The line asked whether the caller would like to leave a message. Do they agree or decline?
