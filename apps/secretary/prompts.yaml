# yaml-language-server: $schema=../../packages/dialogwright/schemas/prompts.schema.json
# Every line a caller can hear. Braces are filled in by the engine ({intentLabel}) or by the code
# ({recipient}); `interruptible` says whether a caller may talk over it. `pnpm check` lists any line the
# engine needs that is missing here.
#
# Every line is said word for word but one part of one line: the read-back of the message,
# confirm_take_message, is a framed line. Its words are fixed and say whose words follow, and only
# {summary} inside it is generated, from the message alone, the first time it is said. Whenever the
# summary is not generated (a no, a repeat, a check that fails, a slow model, no model set up), it is
# the caller's message word for word. The lines that say what was done with the message and the
# handoff lines are prescribed: always said exactly as written.
prompts:
  # The opening lines and the engine's own lines
  greeting:
    text: Thanks for calling Example Front Desk. I can take a message for Riley, Sam or Jordan, check whether they're in, or tell you our hours or our address. How can I help?
    interruptible: true
  greeting_chat:
    text: Hi, this is Example Front Desk. I can take a message for Riley, Sam or Jordan, check whether they're in, or tell you our hours or our address. What can I help with?
    interruptible: true
  ask_intent:
    text: How can I help you today?
    interruptible: true
  # Said both when the words were not understood and when they were a request the desk does not
  # handle, so it says what the desk can do rather than "I didn't catch that".
  nomatch_open:
    text: I can take a message for Riley, Sam or Jordan, check whether they're in, or tell you our hours or our address. What would you like?
    interruptible: true
  nomatch_dtmf_menu:
    text: Let's try the keypad. To leave a message press 1. For our hours press 2. For our address press 3. To reach the studio's main line press 0.
    interruptible: true
  no_input:
    text: I didn't hear anything.
    interruptible: false
  ack_intent:
    text: Sure, I can help you {intentLabel}.
    interruptible: false
  confirm_intent_explicit:
    text: Just to check, do you want to {intentLabel}? Yes or no.
    interruptible: false
  disambiguate_intent:
    text: Do you want to {a}, or {b}?
    interruptible: true
  ack_intent_then:
    text: Sure, I can help you {a}, and then {b}.
    interruptible: false
  ack_queued:
    text: Sure, we'll {intentLabel} after this.
    interruptible: false
  bridge_next:
    text: Now, let's {intentLabel}.
    interruptible: false
  ack_frustration:
    text: I understand, let's get this sorted.
    interruptible: false
  offer_transfer:
    text: Would you like me to put you through to the studio's main line, or keep going?
    interruptible: true
  ack_declined:
    text: Okay, let's keep going.
    interruptible: false
  system_slow_dtmf_hint:
    text: Sorry for the delay. You can also use your keypad.
    interruptible: true
  system_slow_chat:
    text: Sorry, I'm having trouble on my end. Please send that again.
    interruptible: true
  confirm_dtmf:
    text: Press 1 to pass it on, or 2 to change something.
    interruptible: false
  anything_else:
    text: Is there anything else I can help with?
    interruptible: true
  goodbye:
    text: Thanks for calling Example Front Desk. Goodbye.
    interruptible: false
  goodbye_chat:
    text: Thanks for getting in touch with Example Front Desk. Goodbye.
    interruptible: false
  screen_reprompt:
    text: I can take a message, or tell you our hours or our address.
    interruptible: true
  screen_reprompt_form:
    text: Let's keep going.
    interruptible: true

  # Every handoff goes to the studio's main line (app.yaml's transfer), but a caller put through to
  # someone available, who goes to that person's own line. Prescribed: always said exactly as written.
  handoff_live_agent:
    text: One moment while I put you through to the studio's main line.
    interruptible: false
    prescribed: true
  handoff_urgent:
    text: I'll put you straight through to the studio's main line.
    interruptible: false
    prescribed: true
  handoff_frustrated:
    text: Let me put you through to the studio's main line.
    interruptible: false
    prescribed: true
  handoff_max_attempts:
    text: Let me put you through to the studio's main line to help with that.
    interruptible: false
    prescribed: true
  handoff_system_failure:
    text: I'm having trouble right now. Let me put you through to the studio's main line.
    interruptible: false
    prescribed: true
  handoff_needs_human:
    text: This one needs a person. Let me put you through to the studio's main line.
    interruptible: false
    prescribed: true
  handoff_security:
    text: Let me put you through to the studio's main line.
    interruptible: false
    prescribed: true
  # Someone available, and the caller asked to be put through: to that person's own line.
  handoff_put_through:
    text: One moment while I put you through.
    interruptible: false
    prescribed: true
  # The inbox's reply did not pass its check: the message may have gone, so a person takes it from here.
  handoff_result_unchecked:
    text: I couldn't confirm your message was passed on, so let me put you through to the studio's main line.
    interruptible: false
    prescribed: true

  # The fixed answers (intents.yaml's informational intents). The street is invented.
  studio_hours:
    text: The studio is open weekdays, nine to five.
    interruptible: false
  studio_address:
    text: The studio is at 418 Juniper Lane, Suite 2, in Example City.
    interruptible: false

  # Whether someone is in (the whereabouts form): one fixed line per status, chosen by the code from
  # the calendar's checked reply (src/app.ts), never worded by a model. {recipient} is the person's
  # name, {back} the day an out-of-office note gives.
  status_available:
    text: "{recipient} is available."
    interruptible: false
  status_out_of_office:
    text: "{recipient} is out of the office until {back}."
    interruptible: false
  status_out_of_office_no_day:
    text: "{recipient} is out of the office."
    interruptible: false
  status_in_training:
    text: "{recipient} is in training today."
    interruptible: false
  status_in_a_meeting:
    text: "{recipient} is in a meeting right now."
    interruptible: false
  # The team (anyone) is no one's calendar; a status the line could not read is no status.
  status_team:
    text: I can only check on Riley, Sam or Jordan by name.
    interruptible: false
  status_unknown:
    text: I can't check whether {recipient} is in right now.
    interruptible: false

  # What follows the status (routes.yaml). Someone available: put through, or a message
  # (reach_person, bridged into as "Now, let's put you through or take a message.").
  ask_reachHow:
    text: Which would you like?
    interruptible: true
  ask_reachHow_retry:
    text: Sorry, shall I put you through, or take a message?
    interruptible: true
  ask_reachHow_dtmf:
    text: To be put through, press 1. To leave a message, press 2. For neither, press 3.
    interruptible: true
  # Anyone else: a message (offer_message, bridged into as "Now, let's see about a message.").
  ask_leaveMessage:
    text: Would you like to leave one?
    interruptible: true
  ask_leaveMessage_retry:
    text: Sorry, would you like to leave a message? Yes or no.
    interruptible: true
  ask_leaveMessage_dtmf:
    text: To leave a message, press 1. If not, press 2.
    interruptible: true
  # Neither, or no message: said before "Is there anything else I can help with?".
  no_problem:
    text: No problem.
    interruptible: false

  # The message: who it is for, who it is from, the number to call back, and the message itself. The
  # person's question is the whereabouts form's too (one slot, so a message that follows keeps them),
  # so it asks "Who's it for", not "Who's the message for".
  ask_recipient:
    text: Who's it for, Riley Moreno, Sam Okafor, Jordan Lee, or anyone at the studio?
    interruptible: true
  ask_recipient_retry:
    text: Sorry, is it for Riley, Sam, Jordan, or anyone at the studio?
    interruptible: true
  ask_caller:
    text: And who's calling, please?
    interruptible: true
  ask_caller_retry:
    text: Sorry, what name should I give?
    interruptible: true
  ask_phone:
    text: What's the best number to call you back on?
    interruptible: true
  ask_phone_retry:
    text: Sorry, what's the ten-digit number to call you back on?
    interruptible: true
  ask_phone_dtmf:
    text: Please key in the ten-digit number on your keypad.
    interruptible: true
  offer_phone:
    text: Is the number you're calling from, ending in {last4}, the best one to call you back on?
    interruptible: true
  ask_message:
    text: Go ahead with your message.
    interruptible: true
  ask_message_retry:
    text: Sorry, what message should I pass on?
    interruptible: true

  # The read-back, a framed line, spoken to the caller as a receptionist would. Every word of it is
  # fixed but {summary}, which the first time it is said is a short summary of the message, generated
  # from the message alone (the model is given only the goal below, the caller's words and who the
  # message is for, never the rest of the line). The span speaks to the caller (speaks: to-caller):
  # the caller's "I" and "my" become "you" and "your", and a "him" or "her" may become the recipient's
  # name where the drift check agrees ("I just need him to approve it", for Sam, read back as "you
  # need Sam's approval"). The frame speaks to them too ("gets your message, in short:"), and never
  # puts the summary after "{caller} called and said", which would read wrong in the second person.
  # It has two frames: `text`, said only with a generated summary ("..., in short: ..."), and
  # `exactText`, said whenever the span is the message word for word, in the caller's own first
  # person ("..., as you said it: ..."): after a no, on a repeat, on a later reading, and whenever a
  # check fails, the model is slow or none is set up. The name and the number are read back in a
  # sentence of their own. A caller who says no hears it again word for word (forms.yaml's
  # summary.onNo: read-back, after read_back_exact), and so does one who asks to hear it again
  # (repeat_prompt). The caller says yes to the message kept word for word after hearing its
  # summary: summarizesConfirmed says the app accepts that.
  confirm_take_message:
    text: "Thanks! I'll make sure {recipient} gets your message, in short: {summary}. I have you as {caller}, on {phone}. Shall I pass it on?"
    exactText: "I'll make sure {recipient} gets your message, as you said it: {summary}. I have you as {caller}, on {phone}. Shall I pass it on?"
    interruptible: true
    generate:
      summary:
        from: message
        goal: Fill in the blank for this text with the summary, repeating the caller's words back to them in a way that reflects a secretary reading back the message they left.
        words: 30
        speaks: to-caller
        names: [recipient]
    summarizesConfirmed: true
    when:
      situations: [first-ask]
  read_back_exact:
    text: Sorry, let me read it back word for word.
    interruptible: false
  ask_change:
    text: What should I change? You can give me the message again, or ask me to read it back.
    interruptible: true

  # Said when the message is delivered; the call then ends with the goodbye ("Thanks for calling ...
  # Goodbye." on a call, goodbye_chat in a chat). Prescribed: always word for word.
  message_taken:
    text: Your message is on its way to {recipient}.
    interruptible: false
    prescribed: true
