# yaml-language-server: $schema=../../packages/dialogwright/schemas/policy.schema.json
# What the agent may do, action by action: the whole of it. Policy is data here and never lives in
# a tool; the gate decides, before every call, from this file. Every tool in src/app.ts needs an
# action here, and every action not listed is refused. Compliance owns this file.
#
# Two actions. A message delivered to the studio's inbox: nobody verifies who they are (level 0),
# and the message goes only with exactly what the read-back said and the caller said yes to: the
# person, the name, the number and the message word for word (the `confirmed` rule).
actions:
  leaveMessage:
    say: deliver a message to the studio's inbox
    level: 0
    rules:
      - identity
      - confirmed: [recipient, caller, phone, message]

  # A read: whether Riley, Sam or Jordan is in, from the studio's calendar. Nobody verifies (level 0),
  # and it reads only the three people's calendars (the oneOf rule: the team, or anything else, is
  # refused). Its reply is the status and the day an out-of-office note gives, no one's private data.
  personStatus:
    say: read whether Riley, Sam or Jordan is in, from the studio's calendar
    level: 0
    rules:
      - identity
      - oneOf: { field: person, values: [riley, sam, jordan], reason: not-on-the-calendar }

# How each value the action is sent is recorded (the gate event, the trace, the console and the
# audit). The callback number is a digits slot, recorded by its last four as the slot says, and the
# message a text slot recorded by its length (redact: length-summarized, slots.yaml). The person is a
# choice from a short list, kept as it is. The caller's name is their own words: only its length is
# recorded. The inbox gets the message whole; the records do not. The person whose status is read is
# one of three keys, kept as it is.
audit:
  recipient: keep
  caller: length
  person: keep
