# yaml-language-server: $schema=../../packages/dialogwright/schemas/intents.schema.json
# What a caller can ask for, in the order the decision model is offered them, and the keypad menu.
# Each criteria line is sent to the model as written: a change re-keys the recorded cassette
# (fixtures/recorded). Each label is said in acknowledgements ("Sure, I can help you {label}").
intents:
  # The one task: a message for one of the three people, or for anyone (forms.yaml).
  take_message:
    criteria: Wants to leave a message for Riley Moreno, Sam Okafor, Jordan Lee or anyone at the studio, or wants someone to call them back, or wants something only the studio's people can do (a quote, a meeting, a price), which a message passes on, or says yes right after the line offers to take a message. A caller who says who it is for and what to pass on is leaving a message, however many details they add in the same breath, such as their name or their number. A message that only mentions a deadline, or asks for a call back soon, is still a message; a caller who says the matter itself is urgent is urgent's
    label: leave a message
    kind: form

  # Must never wait: said at any point, even in the middle of a message, the call goes to the studio's
  # main line at once (the form's complete hook hands off; see src/app.ts). correctsForm: a caller who
  # says it is urgent at the read-back, with a correction in the same breath, hands over the corrected
  # value.
  urgent:
    criteria: Says their call or their matter is urgent, an emergency, or cannot wait for a call back, and wants to reach someone at the studio now. Said at any point in the call it is urgent's, even in the same breath as a correction or another detail of a message, as in wait, it's for Sam, and it's urgent
    label: reach the studio's main line
    kind: form
    priority: { correctsForm: true }

  # Fixed answers, said word for word (prompts.yaml); "How can I help you today?" follows each.
  studio_hours:
    criteria: Asks when the studio is open, its office hours, or which days it works
    label: hear the studio's hours
    kind: informational
    promptId: studio_hours
  studio_address:
    criteria: Asks where the studio is, its street address, or how to find it
    label: hear the studio's address
    kind: informational
    promptId: studio_address
  # The desk never says where anyone is or when they are in: asked, it says so, and offers a message.
  whereabouts:
    criteria: Asks whether Riley, Sam, Jordan or anyone is in, available, away, on holiday or busy, where they are, when they will be back, or what their schedule is
    label: ask where someone is
    kind: informational
    promptId: no_whereabouts

  # The engine's own control intents. agent and repeat_prompt are required.
  agent:
    criteria: Asks to speak with a person, a representative, or an operator
    label: speak with someone
    kind: control
  repeat_prompt:
    criteria: Asks the system to repeat what it just said, or to read it back exactly or word for word. A caller who wants to say their message again themselves, as in let me say it again, is not asking for a repeat
    label: hear that again
    kind: control
  # The caller is finished: the call ends with the goodbye. Said after an answer ("How can I help you
  # today?"); a message taken ends the call on its own line.
  done:
    criteria: Says they are finished and need nothing more, as in no thanks, that's all, I'm all set, nothing else, I don't need anything else, or goodbye, including a bare no when just asked whether there is anything else
    label: finish up
    kind: control
  other:
    criteria: A request this line does not handle
    label: something else
    kind: control
  none:
    criteria: No request is expressed; the caller is only answering a question or saying something incidental
    label: nothing
    kind: control

# The keypad menu: 1 a message, 2 the hours, 3 the address, 0 the studio's main line.
menu:
  - digit: "1"
    intent: take_message
  - digit: "2"
    intent: studio_hours
  - digit: "3"
    intent: studio_address
  - digit: "0"
    intent: agent
