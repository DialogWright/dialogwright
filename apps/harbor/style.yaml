# yaml-language-server: $schema=../../packages/dialogwright/schemas/style.schema.json
# How the one generated span (a coverage answer worded from its approved passage, on the topics
# kb/topics.yaml marks risk: low) sounds: told to the model, and the phrases to avoid checked on every
# wording before anyone hears it. The span's word budget is the passage's word count and a quarter
# more, ten more at least (prompts.yaml sets none), so a long passage's answer is never cut to fit.
# The model that words it, as the secretary's (the fastest under the call budget in its bake-off of
# 2026-10-14); the environment's RENDER_PROVIDER overrides it. Harbor's own bake-off is the maintainer's
# step (DESIGN.md "Recordings").
persona: a friendly, plain-spoken member services agent at an insurance company
avoid:
  - unfortunately
  - I apologize for the inconvenience
# The model that words the answers: inception/mercury-3 (a diffusion model; no reasoning setting). Measured
# 2026-10-19 on the booklet demo against gemini-3.5-flash-lite at low reasoning (render:bakeoff, 43 lines):
# p50 367 vs 715 ms, 43 of 43 worded vs 41, who pays turned around 2 of 144 for both, a third of the cost.
# (gemini-3.1-flash-lite-preview, the model before, was shut down by Google on 2026-05-25.)
model:
  provider: openrouter
  id: inception/mercury-3
# The drift judge refuses a wording it doubts at 0.3 or more, below the engine's 0.5: on Harbor's
# labelled answer cases (fixtures/judge/answers.jsonl, `pnpm render:judge-eval`), the two unfaithful
# wordings the default let by were exclusions dropped on low-risk topics (0.45, 0.35), and no faithful
# wording on a low-risk topic scored above 0.27. More caution, at no cost measured so far.
judge:
  refuseAt: 0.3
  # Answers from the member handbook (kb.yaml documents) at the default: on its 40 labelled answers the
  # documents judge read every faithful one at 0.36 or below and every unfaithful one at 0.83 or above,
  # and live wordings of faithful answers at up to 0.49 (DESIGN.md, "Knowledge"), so 0.3 would refuse them.
  documentsRefuseAt: 0.5
