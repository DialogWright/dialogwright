# yaml-language-server: $schema=../../packages/dialogwright/schemas/identity.schema.json
# How a caller proves who they are, and who the app serves. Compliance owns this file.
#
# Members verify with their member ID and date of birth (level 1), then a six-digit code texted to
# the phone on file and keyed on the keypad (level 2): the code is said by the phone's last four
# only, and a code said aloud is never taken (the engine texts a new one and asks for the keypad).
# Brokers act for the members their office is agent of record for, with a role, signed in on the
# chat through the broker portal; members sign in through the member portal.
principals:
  subject: member
  delegates:
    broker: { roles: [service_rep, office_admin] }
levels:
  1: { name: verified, factors: [memberId, dob], verify: verifyMember, failedPrompt: identity_failed }
  2: { name: confirmed by code, factors: [{ otp: { length: 6 } }], send: sendCode, verify: verifyCode }
# Three failed tries at the member ID and date of birth, or at the code, and a person takes the call.
attempts: 3
# A portal sign-in proves the top level.
signIn: { level: 2 }
