# yaml-language-server: $schema=../../packages/dialogwright/schemas/app.schema.json
# Harbor Mutual: who the app is and how it presents itself. Members call the member line (or sign in
# to the member portal's chat) to check on a claim, ask what their plan covers, or report a new
# claim; brokers sign in to the chat through the broker portal for their office's clients. The
# dialog is in intents.yaml, forms.yaml, prompts.yaml and policy.yaml, and what runs is in
# src/app.ts. See README.md and DESIGN.md.
id: harbor
locale: en-US

# The app as the operator console names it.
brand:
  name: Harbor Mutual
  mark: HM
  key: harbor

# What the operator console and the policy card show: each form and slot in words.
console:
  formLabels:
    claim_status: Claim status
    coverage: Coverage question
    report_claim: Report a claim
  slotLabels:
    memberId: Member ID
    dob: Date of birth
    claimSelect: Claim
    clientId: Client's member ID
    coverageTopic: Coverage topic
    lossType: Kind of loss
    lossDate: Date of loss
    lossDescription: What happened

# The phone line's speech settings: words a caller says first, which the recognizer should expect.
voice:
  hints: [claim, coverage, covered, report, accident, injury, hospital, diagnosis, member ID, physical therapy, agent]
  # How identifiers are said on the phone (the text stays as written in a chat, the trace and the console):
  # a claim number after the word claim, and the phone's last four after "ending in", digit by digit
  # ("your claim number is four seven three zero", not "four thousand seven hundred thirty"); a member ID
  # or another run of five digits or more in groups of digits.
  spokenDigits:
    - pattern: '([Cc]laim(?: number)?(?: is)?) (\d{4})\b'
      spell: lead
    - pattern: '(ending in) (\d{4})\b'
      spell: lead
    - pattern: '\d{4,}(?: \d{4,})+|\d{5,}'
      spell: groups

# What a transfer hands the person who takes the call: the values the caller never confirmed are
# named (the skill's default for a new app), and the member ID goes by its last four, so the
# specialist can find the member (an identity factor is left out unless named here).
handoff:
  data:
    unconfirmed: mark
    send:
      memberId: masked
      clientId: masked

# The paragraph: "a member who sounds frustrated about a claim is offered" a person. So the
# frustration ladder (the acknowledgement, a person offered, then a person) runs in the claim forms
# only, and in a coverage question set aside from one; on a coverage question alone, or at the
# opening question, the caller's tone is not answered (a person is still theirs for the asking).
frustration:
  forms: [claim_status, report_claim]

# A request made again in the same call (a second coverage question) goes straight to its question or
# its answer, with no "Sure, I can help you check coverage." before it: the maintainer's decision after
# the live call of 2026-10-17, where three coverage questions each heard it (DESIGN.md "Acknowledgements").
# Each new request is acknowledged in the next of ack_intent's wordings (prompts.yaml's variants).
ackIntent:
  repeat: skip

# The engine's own model questions need to know whom the caller is addressing.
wording:
  addressee: the Harbor Mutual member line

# A knowledge-base answer is said whole through kb_answer's {answer}: a passage a person approved.
prompts:
  dataVars: [answer]

# The regression fixtures (corpus, scenarios, baseline, cassette), relative to this folder.
fixtures:
  dir: fixtures

# The adversarial suite (dialogwright/testing adversarialSuite) runs with the regression: announced
# injections, relationships claimed and not proven, off-scope requests, codes said aloud or never
# sent, and hostile replies from every tool, generated from this app and checked by properties over
# each run, never by lines. A case that fails is a finding: fix the app (a tool's reply check, the
# policy) or the engine; never loosen it. With a recording, a case not yet recorded is listed as such.
testing:
  adversarial: on
