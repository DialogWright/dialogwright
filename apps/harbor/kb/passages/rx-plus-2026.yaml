answer: "Prescription drugs and medications aren't covered by this plan, even when they're prescribed for an injury from a covered accident. They're usually covered by your major medical plan, so give the pharmacy that plan's card. The visits, treatment and services this plan does cover are still paid as scheduled, whatever your medical plan pays."
