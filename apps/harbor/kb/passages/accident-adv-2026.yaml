source: { document: accident-advantage-member-guide-2026, section: "0 What counts as a covered accident" }
answer: "A covered accident is a sudden, unexpected event that injures you, such as a fall, a car accident, a sports injury or a burn, so an injury from a fall at home, from a ladder or off a roof is covered like any other accident. An illness, or an injury that comes on gradually from overuse, is not an accident."
