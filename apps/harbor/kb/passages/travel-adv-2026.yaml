source: { document: accident-advantage-member-guide-2026, section: "2 Coverage when you travel" }
answer: "Your plan covers accidents anywhere in the world, with no territorial limit. If you're hurt while you're traveling, get the care you need and keep the itemized bills and any report from the doctor or hospital that treated you. Bills in another currency are fine, and benefits are paid in US dollars. You can file the claim when you get home, as long as it's within 180 days of the accident."
