source: { document: accident-advantage-member-guide-2026, section: "1 Filing a claim" }
answer: "You have 180 days from the date of your accident to tell us about a claim. You can file it in the member portal, in the Harbor Mutual app, or by calling member services, and you'll need the date of the accident, a short description of what happened, and the bills or a statement from the doctor who treated you. Claims sent after 180 days may still be reviewed, but payment isn't guaranteed, so it's best to file as soon as you can. You can send any documents you don't have yet later."
