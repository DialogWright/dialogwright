answer: "Injuries from amateur sports and recreation are covered, including school teams, club and league play, pickup games and fitness classes. Injuries while playing a sport professionally, meaning you're paid to play or compete, are not covered. Coaching or refereeing for pay is not playing professionally, so an injury while doing either is covered like any other accident."
