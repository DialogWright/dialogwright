document: Harbor Mutual Member Handbook
sections:
  "1 Your member ID card":
    text: "Your member ID card shows your name, your plan and your eight-digit member ID. If you lose your card, you can order a new one in the member portal or the Harbor Mutual app, or by calling member services. A new card arrives by mail in 7 to 10 days. You don't have to wait for it: the app shows a digital card you can use right away."
  "2 Paying your premium":
    text: "Your premium is due on the first of each month. You can pay by automatic payment from a bank account or a card, set up in the member portal or the app, or by check by mail. If a payment is missed, you have a 31-day grace period to pay before your coverage ends, and we'll send you a reminder by email. Accidents that happen during the grace period are covered once the premium is paid."
  "3 Updating your contact information":
    text: "You can change your address, phone number or email in the member portal or the app, under Profile, or by calling member services. The phone number on file is where we text your one-time security codes, so keep it current. To change the name on your plan, send us the name change form from the portal with a copy of the legal document that changed it."
  "4 The Harbor Mutual app":
    text: "The Harbor Mutual app is free for iPhone and Android. Sign in with your member ID and the email on your account. In the app you can see your claims and their status, file a new claim, upload bills and photos of documents, and show your digital ID card. If you forget your password, choose Forgot password on the sign-in screen and we'll email you a link to reset it."
  "5 Your explanation of benefits (EOB)":
    text: "After we decide a claim, we send you an explanation of benefits (EOB). It shows what the claim was for, what we paid and to whom, and anything we didn't pay with the reason. An explanation of benefits isn't a bill. You'll find each one in the member portal under Claims, and by mail if you've asked for paper."
  "6 Appealing a claim decision":
    text: "If we deny a claim or you disagree with what we paid, you can appeal. Send your appeal within 180 days of the date on the decision letter, through the member portal or by mail to the address on the letter, with your claim number and why you think the decision should change, and any records that support it. We'll decide your appeal within 30 days. If we keep our decision, the letter tells you how to ask for an independent review."
  "7 Contacting member services":
    text: "Member services is open Monday to Friday from 8 a.m. to 8 p.m. Eastern time, and Saturday from 9 a.m. to 1 p.m. The number is on the back of your ID card. This automated line can check on a claim, report a new one and answer questions about your coverage at any hour. You can also send us a secure message in the member portal, and we'll answer within one business day."
  "8 Adding or removing a family member":
    text: "You can add or remove a spouse or a child during open enrollment, from November 1 to December 15, or within 31 days of a life event such as a marriage, a birth or an adoption. If your plan is through your employer, make the change through your employer's benefits office. A change takes effect on the first day of the month after we receive it."
  "9 Cancelling your plan":
    text: "You can cancel your plan at any time by sending us a request through the member portal or by calling member services. Your coverage ends on the last day of the month you cancel in, and we'll refund any premium you've paid for the months after that. Claims for accidents that happened while you were covered are still paid after your plan ends."
  "10 Your privacy":
    text: "We use your information only to run your plan and pay your claims, and we never sell it. You can ask for a copy of the records we keep about you, or ask us to correct something that's wrong, through the member portal. Our privacy notice, in the portal, explains who we share information with and why."
