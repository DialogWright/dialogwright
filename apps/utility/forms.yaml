# yaml-language-server: $schema=../../packages/dialogwright/schemas/forms.schema.json
# Each form: its slots in the order they are asked, the prompt that reads them back for a yes
# (`null` for a form with no summary), and the hooks it has. The hooks are TypeScript in
# src/app.ts (code.forms.<id>); this list must name exactly the ones the code writes.
forms:
  # Anyone may report an outage (level 0). The summary reads back the address as said and what the
  # caller is seeing, and a yes files the report (a confirmed write).
  report_outage:
    slots: [place, symptom]
    summaryPromptId: confirm_report_outage
    hooks: [confirmedParams, complete]

  # The balance and due date: the entry call needs level 1, so an anonymous caller verifies first.
  # A customer's account is the one they verified as; a property manager names one (principalEntry).
  check_balance:
    slots: [account]
    summaryPromptId: null
    hooks: [entry, onEntry, principalEntry, complete]

  # A payment arrangement: needs level 2 (the one-time code), asked before the form's own slots
  # (the entry call's purpose). A property manager is handed to a person before any question.
  set_up_plan:
    slots: [count, firstDate]
    summaryPromptId: confirm_set_up_plan
    hooks: [entry, principalEntry, onSummaryRead, confirmedParams, complete]
