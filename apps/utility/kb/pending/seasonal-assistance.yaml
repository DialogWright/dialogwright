  excerpt: For the 2026 to 2027 heating season, effective October 1, 2026, households with income at or below 200 percent of the federal poverty guidelines can receive a one-time bill credit of up to 300 dollars. Applications are accepted from October 1, 2026 through March 31, 2027.
